<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vforge 3d CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
  --bg:#EDF2F1; --surface:#FFFFFF; --sunk:#E1E9E7; --ink:#12262E; --ink-2:#4A5F66; --line:#D2DCDA;
  --accent:#00786F; --accent-hover:#005F58; --on-accent:#FFFFFF; --accent-wash:#DCF1EE;
  --warn:#B93A24; --warn-wash:#FBE8E3; --amber:#8A5A00; --amber-wash:#FFF0C7; --focus:#2450E0;
  --scrim:rgba(10,20,22,.45);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --text:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1618; --surface:#142022; --sunk:#1C2B2E; --ink:#E4EEF0; --ink-2:#9FB3B9; --line:#27393D;
    --accent:#43D2C5; --accent-hover:#7BE3D9; --on-accent:#04201D; --accent-wash:#12332F;
    --warn:#FF8A72; --warn-wash:#3A1B15; --amber:#F2C14E; --amber-wash:#3A2E0E; --focus:#8AA5FF;
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1618; --surface:#142022; --sunk:#1C2B2E; --ink:#E4EEF0; --ink-2:#9FB3B9; --line:#27393D;
  --accent:#43D2C5; --accent-hover:#7BE3D9; --on-accent:#04201D; --accent-wash:#12332F;
  --warn:#FF8A72; --warn-wash:#3A1B15; --amber:#F2C14E; --amber-wash:#3A2E0E; --focus:#8AA5FF;
  --scrim:rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--text);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.015em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.neg{color:var(--warn)}

/* shell */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:26px 14px;display:flex;flex-direction:column;gap:30px;border-right:1px solid var(--line)}
.brand,.mbrand{display:flex;align-items:center;gap:10px;font:700 21px/1 var(--display);letter-spacing:-.02em;padding:0 8px}
.brand svg,.mbrand svg{fill:var(--accent);flex:none}
.mbrand{display:none;padding:0;margin-bottom:14px}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);font-weight:500;cursor:pointer;text-align:left}
#nav button:hover{color:var(--ink);background:var(--sunk)}
#nav button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
#nav svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav .step{margin-left:auto;font:600 11px/1 var(--display);border:1px solid var(--line);border-radius:999px;padding:3px 7px;color:var(--ink-2)}
.main{padding:30px clamp(16px,4vw,48px) 72px;max-width:1140px;width:100%}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 18px;margin-bottom:24px}
.bar h1{font-size:32px;font-weight:700}
.bar-right{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
#notice .note{background:var(--amber-wash);color:var(--amber);padding:10px 14px;border-radius:10px;margin-bottom:18px;font-size:14px}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;line-height:1.2;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--warn);border-color:var(--warn);background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:7px}
.btn.busy svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spool-prods{margin-top:2px}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;background:transparent;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.linkish{background:none;border:0;padding:0;font-weight:600;color:var(--ink);text-align:left;cursor:pointer}
.linkish:hover{color:var(--accent);text-decoration:underline}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.search input{width:min(260px,60vw);border-radius:999px;padding-inline:16px}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:42px;width:100%}
input[type=color]{padding:3px;height:42px;cursor:pointer}
textarea{min-height:84px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:.7}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lab{font-weight:600;font-size:13.5px}
.opt{font-weight:400;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.tag.paid{background:var(--accent-wash);color:var(--accent)}
.tag.pending{background:var(--amber-wash);color:var(--amber)}
.tag.low{background:var(--warn-wash);color:var(--warn)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(128,128,128,.55);vertical-align:-1px;margin-right:7px;flex:none}
.dots{display:inline-flex;gap:4px}
.dots .dot{margin:0}

/* content */
.sec{margin-top:38px}
.sec:first-child{margin-top:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.sec h2{font-size:20px;font-weight:600}
.figures+.cols{margin-top:34px}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:8px 48px;align-items:start}
.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0 0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fig{padding:18px 18px 18px 0;display:flex;flex-direction:column;gap:2px}
.fig+.fig{padding-left:20px;border-left:1px solid var(--line)}
.fig-l{color:var(--ink-2);font-size:14px}
.fig-v{font:700 28px/1.15 var(--display);letter-spacing:-.02em}
.fig-s{color:var(--ink-2);font-size:13.5px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;font-size:13.5px;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th:first-child,td:first-child{padding-left:0}
th:last-child,td:last-child{padding-right:0}
.num{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.only-sm{display:none}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.row>div:first-child{display:flex;flex-direction:column;min-width:0}
.row-r{text-align:right;display:flex;flex-direction:column;flex:none}

/* spools: the layer-line bars */
.spool{padding:15px 0;border-bottom:1px solid var(--line)}
.spool-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spool-head strong{font:600 17px/1.2 var(--display);letter-spacing:-.01em}
.spool-left{margin-left:auto;font-weight:600}
.bar-track{height:18px;border-radius:6px;background:var(--sunk);overflow:hidden;margin:10px 0 7px}
.bar-track>i{display:block;height:100%;border-radius:6px 0 0 6px;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0,rgba(0,0,0,.2) 1px,rgba(255,255,255,.14) 1px,rgba(255,255,255,.14) 3px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
.empty{padding:56px 0;max-width:460px}
.empty h2{font-size:22px;margin-bottom:6px}
.empty p{margin:0 0 18px}
.start-list{list-style:none;margin:14px 0 0;padding:0;counter-reset:s}
.start-list li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.start-list li::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);font:700 14px var(--display)}
.start-list li.done::before{content:"\2713";background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.start-list p{margin:0}
.start-list strong{font:600 17px var(--display)}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:-14px 0 44px rgba(0,0,0,.2);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
.drawer>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 14px 24px;border-bottom:1px solid var(--line)}
.drawer h2{font-size:21px;font-weight:700}
.dform{display:flex;flex-direction:column;flex:1;min-height:0}
.dbody{flex:1;overflow:auto;padding:22px 24px;display:flex;flex-direction:column;gap:20px}
.dfoot{padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.dfoot-btns{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dfoot-r{display:flex;gap:10px}
.live{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:14px}
.live strong{font-weight:600}
.err{color:var(--warn);font-size:13.5px;min-height:0}
.err:empty{display:none}
.part{display:flex;flex-direction:column;gap:14px}
.part+.part{border-top:1px solid var(--line);padding-top:20px}
.part h3{font-size:17px;font-weight:600}
.part .hint{margin:-8px 0 0;color:var(--ink-2);font-size:13.5px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 112px 38px;gap:8px;align-items:center}
.warn-box{background:var(--warn-wash);color:var(--warn);padding:10px 12px;border-radius:8px;font-size:13.5px}
.info-box{background:var(--sunk);padding:10px 12px;border-radius:8px;font-size:13.5px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .18s}
#toast.show{opacity:1}
#toast.bad{background:var(--warn);color:#fff}

@media (max-width:860px){
  .app{display:block}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:var(--bg);z-index:30;gap:0}
  .brand{display:none}
  .mbrand{display:flex}
  #nav{flex-direction:row;width:100%;gap:2px}
  #nav button{flex:1;flex-direction:column;gap:3px;padding:8px 1px;font-size:11px;justify-content:center;text-align:center;min-width:0}
  #nav .step{display:none}
  .main{padding:18px 16px 100px}
  .bar h1{font-size:28px}
  .cols{grid-template-columns:1fr}
  .figures{grid-template-columns:1fr 1fr}
  .fig:nth-child(3){padding-left:0;border-left:0}
  .fig:nth-child(n+3){border-top:1px solid var(--line)}
  .hide-sm{display:none}
  .only-sm{display:block}
  input,select,textarea{font-size:16px}
  #toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:480px){
  .grid2{grid-template-columns:1fr}
  .grid2.keep{grid-template-columns:1fr 1fr}
  .fig-v{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><svg viewBox="0 0 28 28" width="26" height="26" aria-hidden="true"><rect x="9" y="4" width="10" height="4" rx="1.5"/><rect x="6" y="10" width="16" height="4" rx="1.5"/><rect x="3" y="16" width="22" height="4" rx="1.5"/><rect x="3" y="22" width="22" height="3" rx="1.5" opacity=".45"/></svg><span>vforge 3d</span></div>
    <nav id="nav" aria-label="Sections"></nav>
  </aside>
  <main class="main">
    <div class="mbrand"><svg viewBox="0 0 28 28" width="24" height="24" aria-hidden="true"><rect x="9" y="4" width="10" height="4" rx="1.5"/><rect x="6" y="10" width="16" height="4" rx="1.5"/><rect x="3" y="16" width="22" height="4" rx="1.5"/><rect x="3" y="22" width="22" height="3" rx="1.5" opacity=".45"/></svg><span>vforge 3d</span></div>
    <div id="notice"></div>
    <div class="bar" id="toolbar"></div>
    <div id="content"></div>
  </main>
</div>
<div id="drawer-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var COLS=['filaments','printers','products','customers','sales','settings'];
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0;}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return ymd(new Date());}
function sum(a,f){return a.reduce(function(t,x){return t+f(x);},0);}
function uniq(a){var seen={},out=[];a.forEach(function(x){var k=String(x||'').trim();if(!k)return;var l=k.toLowerCase();if(!seen[l]){seen[l]=1;out.push(k);}});return out;}
function safeHex(h){return /^#[0-9a-f]{6}$/i.test(h||'')?h:'#8a8f94';}
function byName(a,b){return String(a.name||'').localeCompare(String(b.name||''));}
function fname(o){return [o.brand,o.material,o.colour].filter(Boolean).join(' ');}
function fkey(o){return [o.brand,o.material,o.colour].map(function(s){return String(s||'').trim().toLowerCase();}).join('|');}
var CURRENCIES=[['INR','Indian rupee'],['USD','US dollar'],['EUR','Euro'],['GBP','British pound'],['AED','UAE dirham'],['SGD','Singapore dollar'],['AUD','Australian dollar'],['CAD','Canadian dollar']];
var COLOURS={black:'#1d1f21',white:'#f4f4f2',grey:'#8a8f94',gray:'#8a8f94',silver:'#b8bcc2',red:'#d0312d',orange:'#f08a1c',yellow:'#f2c318',green:'#2e9e5b',blue:'#2b5fd9',purple:'#7a3fc4',pink:'#ec6fa5',brown:'#7a4b2a',gold:'#c9a227',teal:'#1a9c93',cyan:'#20b7d8',beige:'#d8c7a3',transparent:'#cfe3ea',clear:'#cfe3ea'};
function guessHex(name){var w=String(name).toLowerCase().split(/[^a-z]+/);for(var i=0;i<w.length;i++){if(COLOURS[w[i]])return COLOURS[w[i]];}return null;}

var ICONS={
  overview:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V4M16 20v-6M21 20H3"/></svg>',
  filament:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg>',
  products:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>',
  sales:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18l-3.5-2-3.5 2-3.5-2L5 21z"/><path d="M9 8h6M9 12h6"/></svg>',
  customers:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>',
  printers:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16M6 4v16M18 4v16M3 20h18"/><path d="M9.5 8h5v3h-5zM12 11v3"/></svg>',
  x:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- state ---------- */
var DEFAULT_RATE=8;
var state={filaments:[],printers:[],products:[],customers:[],sales:[],settings:{currency:'INR',lowStock:200,powerRate:DEFAULT_RATE},
  loaded:{},ready:false,view:'overview',period:'30',q:'',storage:'workspace'};
var ver=0,statsVer=-1,statsCache=null,backend=null,dlCap=null;

/* ---------- formatting ---------- */
function loc(){return (state.settings.currency||'INR')==='INR'?'en-IN':'en-US';}
function money(n,dp){
  n=num(n);var cur=state.settings.currency||'INR';
  var d=dp!=null?dp:(Math.abs(n-Math.round(n))<0.005?0:2);
  try{return new Intl.NumberFormat(loc(),{style:'currency',currency:cur,minimumFractionDigits:d,maximumFractionDigits:d}).format(n);}
  catch(e){return cur+' '+n.toFixed(d);}
}
function fmtG(n){return (Math.round(num(n)*10)/10).toLocaleString(loc())+' g';}
function pct(n){return Math.round(n)+'%';}
function fmtDate(s){
  if(!s)return '';var p=String(s).split('-').map(Number);if(!p[0])return s;
  return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function signed(n,dp){return (n<0?'\u2212':'')+money(Math.abs(n),dp);}

/* ---------- storage backends ---------- */
function makeDbBackend(db){
  return {
    kind:'workspace',
    subscribe:function(col,cb,onErr){
      return db.collection(col).onSnapshot(function(snap){
        cb(snap.docs.map(function(d){return Object.assign({id:d.id},d.data());}));
      },onErr);
    },
    fetch:function(col){return db.collection(col).get().then(function(snap){return snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});});},
    save:function(col,id,data){return db.collection(col).doc(id).set(data);},
    remove:function(col,id){return db.collection(col).doc(id).delete();},
    newId:function(col){return db.collection(col).doc().id;}
  };
}
function makeLocalBackend(){
  var mem={},subs={},persistent=true;
  try{localStorage.setItem('vforge3d:t','1');localStorage.removeItem('vforge3d:t');}catch(e){persistent=false;}
  function key(c){return 'vforge3d:'+c;}
  function load(c){try{return JSON.parse(localStorage.getItem(key(c))||'[]');}catch(e){return [];}}
  function persist(c){try{localStorage.setItem(key(c),JSON.stringify(mem[c]));}catch(e){}}
  function notify(c){(subs[c]||[]).forEach(function(cb){cb(mem[c].slice());});}
  COLS.forEach(function(c){mem[c]=persistent?load(c):[];});
  return {
    kind:persistent?'device':'memory',
    fetch:function(col){if(persistent)mem[col]=load(col);return Promise.resolve(mem[col].slice());},
    subscribe:function(col,cb){(subs[col]=subs[col]||[]).push(cb);cb(mem[col].slice());return function(){};},
    save:function(col,id,data){
      var rec=Object.assign({id:id},data),i=mem[col].findIndex(function(x){return x.id===id;});
      if(i>=0)mem[col][i]=rec;else mem[col].push(rec);
      persist(col);notify(col);return Promise.resolve();
    },
    remove:function(col,id){mem[col]=mem[col].filter(function(x){return x.id!==id;});persist(col);notify(col);return Promise.resolve();},
    newId:function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
  };
}
function errMsg(e){
  var c=e&&e.code;
  if(c==='quota_exceeded')return 'Storage is full. Delete some old records and try again.';
  if(c==='invalid_argument')return 'You can view this workspace but not change it.';
  if(c==='revoked')return 'Access to this workspace changed. Reload the page.';
  return (e&&e.message)||'Could not save. Try again.';
}
var autoSheetsTimer=null,autoSheetsBusy=false,autoSheetsQueued=false;
function queueAutoSheetsSync(reason){
  var url=(state.settings.googleSheetsUrl||'').trim();
  if(!url||!state.ready)return;
  clearTimeout(autoSheetsTimer);
  autoSheetsTimer=setTimeout(function(){
    if(autoSheetsBusy){autoSheetsQueued=true;return;}
    autoSheetsBusy=true;
    syncGoogleSheets(true).then(function(){
      autoSheetsBusy=false;
      if(autoSheetsQueued){autoSheetsQueued=false;queueAutoSheetsSync('queued');}
    },function(){autoSheetsBusy=false;});
  },900);
}
function syncStateAfterSave(col){
  // Force a fresh read before Google Sheets sync. This guarantees the
  // payload contains the record that was just saved, even if the live
  // listener has not delivered its snapshot yet.
  return Promise.resolve().then(function(){return backend.fetch(col);}).then(function(docs){
    onDocs(col,docs);
    return true;
  });
}
function save(col,id,data){
  return Promise.resolve().then(function(){return backend.save(col,id,data);}).then(function(){
    if(['filaments','products','sales','customers'].indexOf(col)>=0)return syncStateAfterSave(col);
    return true;

}

}

/* ---------- derived numbers ---------- */
function getStats(){
  if(statsCache&&statsVer===ver)return statsCache;
  var map=new Map();
  state.filaments.forEach(function(p){
    var key=p.key||fkey(p),e=map.get(key),stamp=(p.date||'')+'|'+(p.createdAt||'');
    if(!e){e={key:key,brand:p.brand,material:p.material,colour:p.colour,hex:safeHex(p.hex),bought:0,paid:0,used:0,recipeUsed:0,productionUsed:0,saleExtraUsed:0,first:stamp,last:stamp,prods:[]};map.set(key,e);}
    e.bought+=num(p.weight)*num(p.spools);e.paid+=num(p.total);
    if(stamp<e.first){e.first=stamp;e.brand=p.brand;e.material=p.material;e.colour=p.colour;}
    if(stamp>=e.last){e.last=stamp;e.hex=safeHex(p.hex);}
  });

  // A product is a recipe, not stock consumption by itself. "Quantity made"
  // records how many physical pieces were actually produced, so the recipe
  // grams are deducted from filament inventory exactly once for those pieces.
  state.products.forEach(function(pr){
    var qty=Math.max(0,num(pr.quantityMade));
    if(qty>0)(pr.lines||[]).forEach(function(l){
      var e=map.get(l.key);if(e)e.productionUsed+=num(l.grams)*qty;
    });
  });

  // If more pieces are sold than were recorded as made, consume the extra
  // pieces from filament using the current product recipe. Legacy sales that
  // have no production quantity continue to use their saved usage snapshot.
  var soldByProduct=new Map();
  state.sales.forEach(function(s){
    var pid=s.productId;
    soldByProduct.set(pid,(soldByProduct.get(pid)||0)+Math.max(0,num(s.qty)));
  });
  state.sales.forEach(function(s){
    var soldProduct=state.products.find(function(pr){return pr.id===s.productId;});
    if(!soldProduct){
      (s.usage||[]).forEach(function(u){var e=map.get(u.key);if(e)e.used+=num(u.grams)*num(s.qty);});
      return;
    }
    var madeQty=Math.max(0,num(soldProduct.quantityMade));
    if(madeQty<=0){
      (s.usage||[]).forEach(function(u){var e=map.get(u.key);if(e)e.used+=num(u.grams)*num(s.qty);});
    }
  });
  state.products.forEach(function(pr){
    var madeQty=Math.max(0,num(pr.quantityMade));
    var soldQty=soldByProduct.get(pr.id)||0;
    var extraQty=Math.max(0,soldQty-madeQty);
    if(extraQty>0)(pr.lines||[]).forEach(function(l){
      var e=map.get(l.key);if(e)e.saleExtraUsed+=num(l.grams)*extraQty;
    });
  });

  state.products.forEach(function(pr){
    (pr.lines||[]).forEach(function(l){
      var e=map.get(l.key);if(!e)return;
      e.recipeUsed+=num(l.grams);
      var x=e.prods.find(function(q){return q.id===pr.id;});
      if(x)x.grams+=num(l.grams);else e.prods.push({id:pr.id,name:pr.name||'Untitled',grams:num(l.grams)});
    });
  });
  map.forEach(function(e){e.actualUsed=e.productionUsed+e.used+e.saleExtraUsed;e.left=e.bought-e.actualUsed;e.cpg=e.bought>0?e.paid/e.bought:0;e.name=fname(e);});
  statsCache=map;statsVer=ver;return map;
}
function powerOf(printerId,hours){
  var pr=state.printers.find(function(x){return x.id===printerId;});
  var kwh=(pr?num(pr.watts)/1000:0)*num(hours);
  return {printer:pr,kwh:kwh,cost:kwh*num(state.settings.powerRate)};
}
function productCost(prod,S){
  var fil=0,grams=0;
  (prod.lines||[]).forEach(function(l){var e=S.get(l.key);fil+=num(l.grams)*(e?e.cpg:0);grams+=num(l.grams);});
  var pw=powerOf(prod.printerId,prod.printHours),other=num(prod.otherCost);
  return {fil:fil,elec:pw.cost,kwh:pw.kwh,other:other,total:fil+pw.cost+other,grams:grams};
}
function fmtHours(h){
  h=num(h);if(h<=0)return '';
  var t=Math.round(h*60),hh=Math.floor(t/60),mm=t%60;
  return (hh?hh+' h':'')+(hh&&mm?' ':'')+(mm?mm+' min':'');
}
function saleRev(s){return num(s.unitPrice)*num(s.qty);}
function saleCost(s){return num(s.unitCost)*num(s.qty);}
function custName(s){var c=state.customers.find(function(x){return x.id===s.customerId;});return (c&&c.name)||s.customerName||'Unknown customer';}
function prodName(s){var p=state.products.find(function(x){return x.id===s.productId;});return (p&&p.name)||s.productName||'Deleted product';}
function periodSales(){
  if(state.period==='all')return state.sales;
  var c=new Date();c.setDate(c.getDate()-30);var cut=ymd(c);
  return state.sales.filter(function(s){return (s.date||'')>=cut;});
}
function sortedSales(list){
  return list.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||'');});
}

  var q=state.q.trim().toLowerCase();
  var list=sortedSales(state.sales).filter(function(s){return !q||(custName(s)+' '+prodName(s)+' '+(s.notes||'')).toLowerCase().indexOf(q)>=0;});
  if(!list.length)return '<p class="muted">No sales match \u201c'+esc(state.q)+'\u201d.</p>';
  var body=list.map(function(s){
    var pr=saleRev(s)-saleCost(s);
    return '<tr class="click" data-open="sale:'+esc(s.id)+'"><td class="hide-sm">'+esc(fmtDate(s.date))+'</td><td><button class="linkish" data-open="sale:'+esc(s.id)+'">'+esc(custName(s))+'</button><div class="small muted only-sm">'+esc(prodName(s))+' \u00d7 '+num(s.qty)+', '+esc(fmtDate(s.date))+'</div></td><td class="hide-sm">'+esc(prodName(s))+'</td><td class="num hide-sm">'+num(s.qty)+'</td><td class="num">'+money(saleRev(s))+'</td><td class="num hide-sm"><span class="'+(pr<0?'neg':'')+'">'+signed(pr)+'</span></td><td><span class="tag '+(s.status==='pending'?'pending':'paid')+'">'+(s.status==='pending'?'Pending':'Paid')+'</span></td></tr>';
  }).join('');
  return '<div style="overflow-x:auto"><table><thead><tr><th class="hide-sm">Date</th><th>Customer</th><th class="hide-sm">Product</th><th class="num hide-sm">Qty</th><th class="num">Total</th><th class="num hide-sm">Profit</th><th>Payment</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function custStats(){
  var m=new Map();
  state.customers.forEach(function(c){m.set(c.id,{c:c,orders:0,spent:0,last:''});});
  state.sales.forEach(function(s){var e=m.get(s.customerId);if(e){e.orders++;e.spent+=saleRev(s);if((s.date||'')>e.last)e.last=s.date;}});
  return m;
}
function vCustomers(){
  if(!state.customers.length)return empty('No customers yet','Customers are added when you record a sale, or you can add one here first.','new-customer','Add a customer');
  var q=state.q.trim().toLowerCase(),M=custStats();
  var list=Array.from(M.values()).filter(function(e){var c=e.c;return !q||[c.name,c.phone,c.email,c.address].join(' ').toLowerCase().indexOf(q)>=0;}).sort(function(a,b){return byName(a.c,b.c);});
  if(!list.length)return '<p class="muted">No customers match \u201c'+esc(state.q)+'\u201d.</p>';
  var body=list.map(function(e){
    var c=e.c;
    return '<tr class="click" data-open="customer:'+esc(c.id)+'"><td><button class="linkish" data-open="customer:'+esc(c.id)+'">'+esc(c.name)+'</button>'+(c.address?'<div class="small muted">'+esc(c.address)+'</div>':'')+'</td><td class="hide-sm">'+esc(c.phone||'')+(c.email?'<div class="small muted">'+esc(c.email)+'</div>':'')+'</td><td class="num">'+e.orders+'</td><td class="num">'+money(e.spent)+'</td><td class="num hide-sm">'+esc(e.last?fmtDate(e.last):'')+'</td></tr>';
  }).join('');
  return '<div style="overflow-x:auto"><table><thead><tr><th>Customer</th><th class="hide-sm">Contact</th><th class="num">Orders</th><th class="num">Spent</th><th class="num hide-sm">Last order</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}

/* ---------- drawer ---------- */
var drawerOpen=false,lastFocus=null;
function openDrawer(title,html){
  closeDrawer(true);
  lastFocus=document.activeElement;
  var root=$('#drawer-root');
  root.innerHTML='<div class="scrim" data-dclose></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle"><header><h2 id="dtitle">'+esc(title)+'</h2><button type="button" class="iconbtn" data-dclose aria-label="Close">'+ICONS.x+'</button></header><form class="dform" novalidate>'+html+'</form></aside>';
  drawerOpen=true;document.documentElement.style.overflow='hidden';
  var form=$('form',root),first=form.querySelector('input:not([type=hidden]):not([type=color]),select,textarea');
  if(first)first.focus();
  return form;
}
function closeDrawer(quiet){
  if(!drawerOpen)return;
  $('#drawer-root').innerHTML='';drawerOpen=false;document.documentElement.style.overflow='';
  if(!quiet&&lastFocus&&lastFocus.focus&&document.contains(lastFocus))lastFocus.focus();
}
function foot(live,canDelete,label){
  return '<div class="dfoot"><div class="err" id="err" role="alert"></div>'+live+'<div class="dfoot-btns">'+(canDelete?'<button type="button" class="btn danger" data-del data-label="Delete">Delete</button>':'<span></span>')+'<div class="dfoot-r"><button type="button" class="btn" data-dclose>Cancel</button><button type="submit" class="btn primary">'+esc(label)+'</button></div></div></div>';
}
function fail(form,msg){var e=$('#err',form);e.textContent=msg;var f=$('.dbody',form);if(f)f.scrollTop=0;return false;}
function wireSubmit(form,handler){
  var busy=false;
  form.addEventListener('submit',function(ev){
    ev.preventDefault();if(busy)return;busy=true;$('#err',form).textContent='';
    var b=form.querySelector('button[type=submit]');b.disabled=true;
    Promise.resolve(handler()).then(function(ok){if(ok)closeDrawer();},function(){toast('Something went wrong. Try again.',true);}).then(function(){busy=false;if(b)b.disabled=false;});
  });
}
function armDelete(form,run){
  var b=form.querySelector('[data-del]');if(!b)return;
  var armed=false,t;
  b.addEventListener('click',function(){
    if(!armed){armed=true;b.textContent='Confirm delete';t=setTimeout(function(){armed=false;b.textContent=b.dataset.label;},4000);return;}
    clearTimeout(t);b.disabled=true;
    Promise.resolve(run()).then(function(ok){if(ok)closeDrawer();else{b.disabled=false;armed=false;b.textContent=b.dataset.label;}});
  });
}
function ctl(form,n){return form.elements.namedItem(n);}

function openProduct(id){
  var S=getStats(),p=id?state.products.find(function(x){return x.id===id;}):null;
  if(id&&!p)return;
  var opts=Array.from(S.values()).sort(byName);
  var lines=p?(p.lines||[]).map(function(l){return {key:l.key,name:l.name,grams:l.grams};}):[];
  if(!lines.length&&opts.length)lines=[{key:opts[0].key,name:opts[0].name,grams:''}];
  var v=p||{name:'',category:'',description:'',printHours:'',price:'',otherCost:'',printerId:'',quantityMade:1};
  var ph=num(v.printHours),hh=Math.floor(ph+1e-9),mm=Math.round((ph-hh)*60);if(mm>=60){hh+=1;mm=0;}
  var printers=state.printers.slice().sort(byName);
  var cats=uniq(state.products.map(function(x){return x.category;}));
  function lineHtml(l,i){
    var known=S.has(l.key);
    var o=opts.map(function(e){return '<option value="'+esc(e.key)+'"'+(e.key===l.key?' selected':'')+'>'+esc(e.name)+' ('+money(e.cpg,2)+'/g)</option>';}).join('')
      +(known||!l.key?'':'<option value="'+esc(l.key)+'" selected>'+esc(l.name||l.key)+' (no longer logged)</option>');
    return '<div class="line"><select aria-label="Filament">'+o+'</select><input type="number" inputmode="decimal" min="0" step="any" aria-label="Grams used" placeholder="Grams" value="'+(l.grams===''||l.grams==null?'':esc(l.grams))+'"><button type="button" class="iconbtn" data-rm="'+i+'" aria-label="Remove filament">'+ICONS.x+'</button></div>';
  }
  var gramsPart=opts.length||lines.length
    ?'<div id="lines" class="stack">'+lines.map(lineHtml).join('')+'</div><div><button type="button" class="btn" data-add>Add another filament</button></div>'
    :'<div class="info-box">Log a filament purchase first, so there is a cost per gram to work from.</div><div><button type="button" class="btn primary" data-goto-purchase>Log a purchase</button></div>';
  var printerOpts='<option value="">No printer</option>'+printers.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===v.printerId?' selected':'')+'>'+esc(x.name)+' ('+num(x.watts)+' W)</option>';}).join('')
    +(p&&v.printerId&&!printers.some(function(x){return x.id===v.printerId;})?'<option value="'+esc(v.printerId)+'" selected>'+esc(p.printerName||'Deleted printer')+' (no longer added)</option>':'');
  var powerPart=printers.length
    ?'<div class="field"><label for="p-printer">Printer</label><select id="p-printer" name="printer">'+printerOpts+'</select></div>'
      +'<div class="grid2 keep"><div class="field"><label for="p-hours">Print time, hours</label><input id="p-hours" name="hours" type="number" inputmode="numeric" min="0" step="1" placeholder="0" value="'+(hh?hh:'')+'"></div>'
      +'<div class="field"><label for="p-mins">Minutes</label><input id="p-mins" name="mins" type="number" inputmode="numeric" min="0" max="59" step="1" placeholder="0" value="'+(mm?mm:'')+'"></div></div>'
      +'<div id="powernote" class="small muted"></div>'
    :'<div class="info-box">Add a printer with its watts, and the electricity for this print time is worked out for you.</div><div><button type="button" class="btn" data-goto-printer>Add a printer</button></div>'
      +'<input type="hidden" name="printer" value=""><input type="hidden" name="hours" value="'+(hh||'')+'"><input type="hidden" name="mins" value="'+(mm||'')+'">';
  var html='<div class="dbody">'
    +'<div class="field"><label for="p-name">Product name</label><input id="p-name" name="name" autocomplete="off" value="'+esc(v.name)+'"></div>'
    +'<div class="part"><h3>Grams used</h3><p class="hint">Filament used to print one piece, supports and waste included.</p>'+gramsPart
    +'<div class="field"><label for="p-made">Quantity made</label><input id="p-made" name="made" type="number" inputmode="numeric" min="0" step="1" placeholder="0" value="'+esc(v.quantityMade==null?0:v.quantityMade)+'"><span class="small muted">This quantity is deducted from filament stock. Leave 0 if this is only a product recipe.</span></div>'
    +'<div class="field"><label for="p-other">Other cost per piece <span class="opt">optional</span></label><input id="p-other" name="other" type="number" inputmode="decimal" min="0" step="any" placeholder="Packaging, labour" value="'+esc(v.otherCost)+'"></div></div>'
    +'<div class="part"><h3>Print time and power</h3><p class="hint">Time to print one piece. Electricity is watts \u00d7 hours \u00d7 your price per unit.</p>'+powerPart+'</div>'
    +'<div class="part"><h3>Details and price</h3>'
    +'<div class="field"><label for="p-cat">Category <span class="opt">optional</span></label><input id="p-cat" name="category" list="dl-cat" autocomplete="off" value="'+esc(v.category||'')+'"></div>'
    +'<div class="field"><label for="p-desc">Details <span class="opt">optional</span></label><textarea id="p-desc" name="description" placeholder="Size, colour options, infill, finish">'+esc(v.description||'')+'</textarea></div>'
    +'<div class="field"><label for="p-price">Listed price</label><input id="p-price" name="price" type="number" inputmode="decimal" min="0" step="any" value="'+esc(v.price)+'"></div>'
    +'<datalist id="dl-cat">'+cats.map(function(c){return '<option value="'+esc(c)+'">';}).join('')+'</datalist></div>'
    +'</div>'+foot('<div class="live" id="live"></div>',!!p,p?'Save changes':'Save product');
  var form=openDrawer(p?'Edit product':'New product',html);
  function sync(){
    lines=$$('.line',form).map(function(r,i){
      var sel=r.querySelector('select'),key=sel.value,e=S.get(key);
      return {key:key,name:e?e.name:(lines[i]&&lines[i].key===key?lines[i].name:key),grams:r.querySelector('input').value};
    });
  }
  function draw(){var a=$('#lines',form);if(a)a.innerHTML=lines.map(lineHtml).join('');}
  function hoursVal(){return Math.max(0,Math.round(num(ctl(form,'hours').value)))+Math.max(0,Math.min(59,Math.round(num(ctl(form,'mins').value))))/60;}
  function upd(){
    sync();
    var hrs=hoursVal(),pid=ctl(form,'printer').value;
    var c=productCost({lines:lines.map(function(l){return {key:l.key,grams:num(l.grams)};}),otherCost:ctl(form,'other').value,printerId:pid,printHours:hrs},S);

    }

    var used=lines.filter(function(l){return l.key&&num(l.grams)>0;}).map(function(l){return {key:l.key,name:l.name,grams:num(l.grams)};});
    if(!used.length)return fail(form,'Add the grams of filament used for one piece.');
    var pid=ctl(form,'printer').value,hrs=hoursVal();
    if(pid&&!(hrs>0))return fail(form,'Add the print time so the electricity can be worked out.');

/* ---------- reports + Google Sheets ---------- */
function reportFilaments(){
  return Array.from(getStats().values()).sort(byName).map(function(e){
    return {
      'Brand':e.brand||'Generic',
      'Material':e.material||'',
      'Colour':e.colour||'',
      'Purchased (g)':Math.round(e.bought*10)/10,
      'Used for products made (g)':Math.round(e.productionUsed*10)/10,
      'Used in unproduced sales (g)':Math.round(e.used*10)/10,
      'Configured in product recipes (g/piece)':Math.round(e.recipeUsed*10)/10,
      'Total actual used (g)':Math.round(e.actualUsed*10)/10,
      'Remaining (g)':Math.round(e.left*10)/10,
      'Total paid':Math.round(e.paid*100)/100,
      'Cost / g':Math.round(e.cpg*10000)/10000
    };
  });
}
function reportProducts(){
  var S=getStats();
  return state.products.slice().sort(byName).map(function(p){
    var c=productCost(p,S), margin=num(p.price)-c.total;
    return {
      'Product':p.name||'',
      'Category':p.category||'',
      'Quantity made':Math.max(0,num(p.quantityMade)),
      'Filament per piece (g)':Math.round(c.grams*10)/10,
      'Filament cost / piece':Math.round(c.fil*100)/100,
      'Electricity cost':Math.round(c.elec*100)/100,
      'Other cost':Math.round(c.other*100)/100,
      'Total cost':Math.round(c.total*100)/100,
      'Listed price':Math.round(num(p.price)*100)/100,
      'Margin':Math.round(margin*100)/100,
      'Margin %':num(p.price)>0?Math.round(margin/num(p.price)*10000)/100:0
    };
  });
}
function reportSales(){
  return sortedSales(state.sales).map(function(s){
    var revenue=saleRev(s), cost=saleCost(s);
    return {
      'Date':s.date||'',
      'Customer':custName(s),
      'Product':prodName(s),
      'Qty':num(s.qty),
      'Unit price':Math.round(num(s.unitPrice)*100)/100,
      'Sales total':Math.round(revenue*100)/100,
      'Unit cost':Math.round(num(s.unitCost)*100)/100,
      'Total cost':Math.round(cost*100)/100,
      'Profit':Math.round((revenue-cost)*100)/100,
      'Payment':s.status==='pending'?'Pending':'Paid'
    };
  });
}

    cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+

    source:'vforge 3d CRM',
    syncedAt:new Date().toISOString(),
    filament:reportFilaments(),

  });

function testGoogleSheets(){
  var url=(state.settings.googleSheetsUrl||'').trim();
  if(!url){toast('Add your Google Sheets Web App URL in Settings first.',true);return;}
  var frame=document.getElementById('sheets-test-frame');
  if(!frame){frame=document.createElement('iframe');frame.id='sheets-test-frame';frame.name='sheets-test-frame';frame.style.display='none';document.body.appendChild(frame);}
  frame.onload=function(){toast('Google Sheets Web App is reachable.');};
  frame.src=url+'?test='+encodeURIComponent(Date.now());
}
function syncGoogleSheets(silent){
  var url=(state.settings.googleSheetsUrl||'').trim();
  if(!url){
    if(!silent)toast('Add your Google Sheets Web App URL in Settings first.',true);
    return Promise.reject(new Error('Google Sheets URL is not configured'));
  }
  if(!silent)toast('Sending report to Google Sheets…');

  // IMPORTANT: Do not use form.submit() or iframe navigation here.
  // In the ChatGPT/local HTML environment that can trigger an
  // "External site" confirmation popup. sendBeacon sends the POST in the
  // background without navigating the current page.
  var payload=sheetsPayload();
  var body=new URLSearchParams();
  body.append('payload',payload);

  return new Promise(function(resolve,reject){
    var sent=false;
    try{
      if(navigator.sendBeacon){
        sent=navigator.sendBeacon(url,body);
      }
    }catch(err){sent=false;}

    // Fallback for browsers that reject sendBeacon. This request also does
    // not navigate the page. Apps Script receives it as a POST parameter.
    if(!sent){
      try{
        fetch(url,{
          method:'POST',
          mode:'no-cors',
          body:body,
          keepalive:true,
          credentials:'omit'
        });
        sent=true;
      }catch(err){sent=false;}
    }

    if(!sent){
      if(!silent)toast('Could not send the Google Sheets report.',true);
      reject(new Error('Google Sheets request could not be queued'));
      return;
    }

    state.settings.lastSheetsSync=new Date().toISOString();
    // Do not save settings here; that would trigger another sync loop.
    if(!silent)toast('✓ Filament/Product/Sales reports sent to Google Sheets');
    else toast('✓ Google Sheets auto-updated');
    resolve(true);
  });
}

function reportCsv(rows){
  if(!rows.length)return '';
  var cols=Object.keys(rows[0]);
  function cell(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}
  return cols.map(cell).join(',')+'\\n'+rows.map(function(r){return cols.map(function(c){return cell(r[c]);}).join(',');}).join('\\n');
}
function exportReportsCsv(){
  var f=reportCsv(reportFilaments()),p=reportCsv(reportProducts()),s=reportCsv(reportSales());
  offerFile('vforge-3d-reports-filament.csv',f);
  setTimeout(function(){offerFile('vforge-3d-reports-products.csv',p);},150);
  setTimeout(function(){offerFile('vforge-3d-reports-sales.csv',s);},300);
}

function csvCell(v,text){
  var s=String(v==null?'':v);
  if(text&&/^[=+\-@\t\r]/.test(s))s="'"+s;

}
function salesCsv(){
  var head=['Date','Customer','Phone','Email','Product','Quantity','Price per piece','Total','Cost per piece','Profit','Payment','Notes'];
  var rows=sortedSales(state.sales).map(function(s){

    return [[s.date,1],[custName(s),1],[c.phone||'',1],[c.email||'',1],[prodName(s),1],[num(s.qty),0],[num(s.unitPrice),0],[saleRev(s),0],[num(s.unitCost),0],[saleRev(s)-saleCost(s),0],[s.status==='pending'?'Pending':'Paid',1],[s.notes||'',1]].map(function(x){return csvCell(x[0],x[1]);}).join(',');

document.addEventListener('click',function(e){

  if(t&&drawerOpen){closeDrawer();return;}
  t=e.target.closest('[data-view]');
  if(t&&!drawerOpen){go(t.dataset.view);return;}
  t=e.target.closest('[data-open]');
  if(t&&!drawerOpen){
    var p=t.dataset.open.split(':'),k=p[0],id=p.slice(1).join(':');
    if(k==='purchase')openPurchase(id);else if(k==='printer')openPrinter(id);else if(k==='product')openProduct(id);else if(k==='sale')openSale(id);else if(k==='customer')openCustomer(id);
    return;
  }
  t=e.target.closest('[data-act]');
  if(t&&!drawerOpen&&!t.disabled){
    var a=t.dataset.act;
    if(a==='new-purchase')openPurchase();
    else if(a==='new-product')openProduct();
    else if(a==='new-printer')openPrinter();
    else if(a==='new-sale')openSale();
    else if(a==='new-customer')openCustomer();

  var f=$$('button,input,select,textarea',d).filter(function(x){return !x.disabled&&(x.offsetParent!==null||x===document.activeElement);});
  if(!f.length)return;
  var first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});

/* ---------- refresh ---------- */
var refreshing=false,lastRefresh=Date.now();
function setStamp(){
  var e=$('#stamp');
  if(e&&state.updatedAt)e.textContent='Updated '+state.updatedAt.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
}
function refresh(silent){
  if(refreshing||!backend)return Promise.resolve();
  refreshing=true;lastRefresh=Date.now();
  var b=$('#refresh-btn');if(b){b.classList.add('busy');b.disabled=true;}
  return Promise.all(COLS.map(function(c){return Promise.resolve(backend.fetch(c)).then(function(docs){onDocs(c,docs);});}))
    .then(function(){if(!silent)toast('Refreshed');},function(){if(!silent)toast('Could not refresh. Check your connection and try again.',true);})
    .then(function(){refreshing=false;var b2=$('#refresh-btn');if(b2){b2.classList.remove('busy');b2.disabled=false;}});
}

/* ---------- boot ---------- */
function onDocs(col,docs){
  if(col==='settings'){
    var m=docs.find(function(d){return d.id==='main';});
    state.settings=Object.assign({currency:'INR',lowStock:200,powerRate:DEFAULT_RATE,googleSheetsUrl:'',lastSheetsSync:''},m||{});
  }else state[col]=docs;
  ver++;state.loaded[col]=true;state.updatedAt=new Date();
  if(!state.ready&&COLS.every(function(c){return state.loaded[c];}))state.ready=true;
  if(state.ready){
    renderContent();setStamp();
    // Sync only after the live/backend update has reached local state.
    // This prevents Google Sheets from receiving the previous inventory snapshot.
    if(['filaments','products','sales','customers'].indexOf(col)>=0)queueAutoSheetsSync('backend-update:'+col);
  }
}
function boot(){
  render();
  var claude=window.claude,useFn=claude&&typeof claude.use==='function';
  var dbP=useFn?Promise.resolve().then(function(){return claude.use('db');}).catch(function(){return null;}):Promise.resolve(null);
  var dlP=useFn?Promise.resolve().then(function(){return claude.use('downloads');}).catch(function(){return null;}):Promise.resolve(null);
  Promise.all([dbP,dlP]).then(function(r){
    dlCap=r[1];
    backend=r[0]?makeDbBackend(r[0]):makeLocalBackend();
    state.storage=backend.kind;
    renderNotice();
    COLS.forEach(function(c){
      backend.subscribe(c,function(docs){onDocs(c,docs);},function(err){
        toast(err&&err.code==='revoked'?'Access to this workspace changed. Reload the page.':'Live updates stopped. Reload the page.',true);
      });
    });
    setTimeout(function(){if(!state.ready){state.ready=true;renderContent();}},6000);
  });
}
boot();
})();
</script>
