<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="VFORGE%20ICON.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vforge 3d CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
  --bg:#EDF2F1; --surface:#FFFFFF; --sunk:#E1E9E7; --ink:#12262E; --ink-2:#4A5F66; --line:#D2DCDA;
  --accent:#00786F; --accent-hover:#005F58; --on-accent:#FFFFFF; --accent-wash:#DCF1EE;
  --warn:#B93A24; --warn-wash:#FBE8E3; --amber:#8A5A00; --amber-wash:#FFF0C7; --focus:#2450E0;
  --scrim:rgba(10,20,22,.45);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --text:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1618; --surface:#142022; --sunk:#1C2B2E; --ink:#E4EEF0; --ink-2:#9FB3B9; --line:#27393D;
    --accent:#43D2C5; --accent-hover:#7BE3D9; --on-accent:#04201D; --accent-wash:#12332F;
    --warn:#FF8A72; --warn-wash:#3A1B15; --amber:#F2C14E; --amber-wash:#3A2E0E; --focus:#8AA5FF;
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1618; --surface:#142022; --sunk:#1C2B2E; --ink:#E4EEF0; --ink-2:#9FB3B9; --line:#27393D;
  --accent:#43D2C5; --accent-hover:#7BE3D9; --on-accent:#04201D; --accent-wash:#12332F;
  --warn:#FF8A72; --warn-wash:#3A1B15; --amber:#F2C14E; --amber-wash:#3A2E0E; --focus:#8AA5FF;
  --scrim:rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--text);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.015em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.neg{color:var(--warn)}

/* shell */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:26px 14px;display:flex;flex-direction:column;gap:30px;border-right:1px solid var(--line)}
.brand,.mbrand{display:flex;align-items:center;gap:10px;font:700 21px/1 var(--display);letter-spacing:-.02em;padding:0 8px}
.brand svg,.mbrand svg{fill:var(--accent);flex:none}
.mbrand{display:none;padding:0;margin-bottom:14px}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);font-weight:500;cursor:pointer;text-align:left}
#nav button:hover{color:var(--ink);background:var(--sunk)}
#nav button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
#nav svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav .step{margin-left:auto;font:600 11px/1 var(--display);border:1px solid var(--line);border-radius:999px;padding:3px 7px;color:var(--ink-2)}
.main{padding:30px clamp(16px,4vw,48px) 72px;max-width:1140px;width:100%}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 18px;margin-bottom:24px}
.bar h1{font-size:32px;font-weight:700}
.bar-right{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
#notice .note{background:var(--amber-wash);color:var(--amber);padding:10px 14px;border-radius:10px;margin-bottom:18px;font-size:14px}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;line-height:1.2;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--warn);border-color:var(--warn);background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:7px}
.btn.busy svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spool-prods{margin-top:2px}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;background:transparent;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.linkish{background:none;border:0;padding:0;font-weight:600;color:var(--ink);text-align:left;cursor:pointer}
.linkish:hover{color:var(--accent);text-decoration:underline}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.search input{width:min(260px,60vw);border-radius:999px;padding-inline:16px}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:42px;width:100%}
input[type=color]{padding:3px;height:42px;cursor:pointer}
textarea{min-height:84px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:.7}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lab{font-weight:600;font-size:13.5px}
.opt{font-weight:400;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.tag.paid{background:var(--accent-wash);color:var(--accent)}
.tag.pending{background:var(--amber-wash);color:var(--amber)}
.tag.low{background:var(--warn-wash);color:var(--warn)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(128,128,128,.55);vertical-align:-1px;margin-right:7px;flex:none}
.dots{display:inline-flex;gap:4px}
.dots .dot{margin:0}

/* content */
.sec{margin-top:38px}
.sec:first-child{margin-top:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.sec h2{font-size:20px;font-weight:600}
.figures+.cols{margin-top:34px}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:8px 48px;align-items:start}
.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0 0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fig{padding:18px 18px 18px 0;display:flex;flex-direction:column;gap:2px}
.fig+.fig{padding-left:20px;border-left:1px solid var(--line)}
.fig-l{color:var(--ink-2);font-size:14px}
.fig-v{font:700 28px/1.15 var(--display);letter-spacing:-.02em}
.fig-s{color:var(--ink-2);font-size:13.5px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;font-size:13.5px;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th:first-child,td:first-child{padding-left:0}
th:last-child,td:last-child{padding-right:0}
.num{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.only-sm{display:none}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.row>div:first-child{display:flex;flex-direction:column;min-width:0}
.row-r{text-align:right;display:flex;flex-direction:column;flex:none}

/* spools: the layer-line bars */
.spool{padding:15px 0;border-bottom:1px solid var(--line)}
.spool-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spool-head strong{font:600 17px/1.2 var(--display);letter-spacing:-.01em}
.spool-left{margin-left:auto;font-weight:600}
.bar-track{height:18px;border-radius:6px;background:var(--sunk);overflow:hidden;margin:10px 0 7px}
.bar-track>i{display:block;height:100%;border-radius:6px 0 0 6px;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0,rgba(0,0,0,.2) 1px,rgba(255,255,255,.14) 1px,rgba(255,255,255,.14) 3px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
.empty{padding:56px 0;max-width:460px}
.empty h2{font-size:22px;margin-bottom:6px}
.empty p{margin:0 0 18px}
.start-list{list-style:none;margin:14px 0 0;padding:0;counter-reset:s}
.start-list li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.start-list li::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);font:700 14px var(--display)}
.start-list li.done::before{content:"\2713";background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.start-list p{margin:0}
.start-list strong{font:600 17px var(--display)}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:-14px 0 44px rgba(0,0,0,.2);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
.drawer>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 14px 24px;border-bottom:1px solid var(--line)}
.drawer h2{font-size:21px;font-weight:700}
.dform{display:flex;flex-direction:column;flex:1;min-height:0}
.dbody{flex:1;overflow:auto;padding:22px 24px;display:flex;flex-direction:column;gap:20px}
.dfoot{padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.dfoot-btns{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dfoot-r{display:flex;gap:10px}
.live{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:14px}
.live strong{font-weight:600}
.err{color:var(--warn);font-size:13.5px;min-height:0}
.err:empty{display:none}
.part{display:flex;flex-direction:column;gap:14px}
.part+.part{border-top:1px solid var(--line);padding-top:20px}
.part h3{font-size:17px;font-weight:600}
.part .hint{margin:-8px 0 0;color:var(--ink-2);font-size:13.5px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 112px 38px;gap:8px;align-items:center}
.warn-box{background:var(--warn-wash);color:var(--warn);padding:10px 12px;border-radius:8px;font-size:13.5px}
.info-box{background:var(--sunk);padding:10px 12px;border-radius:8px;font-size:13.5px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .18s}
#toast.show{opacity:1}
#toast.bad{background:var(--warn);color:#fff}

@media (max-width:860px){
  .app{display:block}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:var(--bg);z-index:30;gap:0}
  .brand{display:none}
  .mbrand{display:flex}
  #nav{flex-direction:row;width:100%;gap:2px}
  #nav button{flex:1;flex-direction:column;gap:3px;padding:8px 1px;font-size:11px;justify-content:center;text-align:center;min-width:0}
  #nav .step{display:none}
  .main{padding:18px 16px 100px}
  .bar h1{font-size:28px}
  .cols{grid-template-columns:1fr}
  .figures{grid-template-columns:1fr 1fr}
  .fig:nth-child(3){padding-left:0;border-left:0}
  .fig:nth-child(n+3){border-top:1px solid var(--line)}
  .hide-sm{display:none}
  .only-sm{display:block}
  input,select,textarea{font-size:16px}
  #toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:480px){
  .grid2{grid-template-columns:1fr}
  .grid2.keep{grid-template-columns:1fr 1fr}
  .fig-v{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><svg viewBox="0 0 28 28" width="26" height="26" aria-hidden="true"><rect x="9" y="4" width="10" height="4" rx="1.5"/><rect x="6" y="10" width="16" height="4" rx="1.5"/><rect x="3" y="16" width="22" height="4" rx="1.5"/><rect x="3" y="22" width="22" height="3" rx="1.5" opacity=".45"/></svg><span>vforge 3d</span></div>
    <nav id="nav" aria-label="Sections"></nav>
  </aside>
  <main class="main">
    <div class="mbrand"><svg viewBox="0 0 28 28" width="24" height="24" aria-hidden="true"><rect x="9" y="4" width="10" height="4" rx="1.5"/><rect x="6" y="10" width="16" height="4" rx="1.5"/><rect x="3" y="16" width="22" height="4" rx="1.5"/><rect x="3" y="22" width="22" height="3" rx="1.5" opacity=".45"/></svg><span>vforge 3d</span></div>
    <div id="notice"></div>
    <div class="bar" id="toolbar"></div>
    <div id="content"></div>
  </main>
</div>
<div id="drawer-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var COLS=['filaments','printers','products','customers','sales','wastage','transfers','settings'];
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0;}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return ymd(new Date());}
function sum(a,f){return a.reduce(function(t,x){return t+f(x);},0);}
function uniq(a){var seen={},out=[];a.forEach(function(x){var k=String(x||'').trim();if(!k)return;var l=k.toLowerCase();if(!seen[l]){seen[l]=1;out.push(k);}});return out;}
function safeHex(h){return /^#[0-9a-f]{6}$/i.test(h||'')?h:'#8a8f94';}
function byName(a,b){return String(a.name||'').localeCompare(String(b.name||''));}
function fname(o){return [o.brand,o.material,o.colour].filter(Boolean).join(' ');}
function fkey(o){return [o.brand,o.material,o.colour].map(function(s){return String(s||'').trim().toLowerCase();}).join('|');}
var CURRENCIES=[['INR','Indian rupee'],['USD','US dollar'],['EUR','Euro'],['GBP','British pound'],['AED','UAE dirham'],['SGD','Singapore dollar'],['AUD','Australian dollar'],['CAD','Canadian dollar']];
var COLOURS={black:'#1d1f21',white:'#f4f4f2',grey:'#8a8f94',gray:'#8a8f94',silver:'#b8bcc2',red:'#d0312d',orange:'#f08a1c',yellow:'#f2c318',green:'#2e9e5b',blue:'#2b5fd9',purple:'#7a3fc4',pink:'#ec6fa5',brown:'#7a4b2a',gold:'#c9a227',teal:'#1a9c93',cyan:'#20b7d8',beige:'#d8c7a3',transparent:'#cfe3ea',clear:'#cfe3ea'};
function guessHex(name){var w=String(name).toLowerCase().split(/[^a-z]+/);for(var i=0;i<w.length;i++){if(COLOURS[w[i]])return COLOURS[w[i]];}return null;}

var ICONS={
  overview:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V4M16 20v-6M21 20H3"/></svg>',
  filament:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg>',
  wastage:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/></svg>',
  transfers:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h15M15 3l4 4-4 4M20 17H5m4-4-4 4 4 4"/></svg>',
  products:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>',
  sales:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18l-3.5-2-3.5 2-3.5-2L5 21z"/><path d="M9 8h6M9 12h6"/></svg>',
  customers:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>',
  printers:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16M6 4v16M18 4v16M3 20h18"/><path d="M9.5 8h5v3h-5zM12 11v3"/></svg>',
  x:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- state ---------- */
var DEFAULT_RATE=8;
var state={filaments:[],printers:[],products:[],customers:[],sales:[],wastage:[],transfers:[],settings:{currency:'INR',lowStock:200,powerRate:DEFAULT_RATE,googleSheetsUrl:'',lastSheetsSync:''},
  loaded:{},ready:false,view:'overview',period:'30',q:'',storage:'workspace'};
var ver=0,statsVer=-1,statsCache=null,backend=null,dlCap=null;

/* ---------- formatting ---------- */
function loc(){return (state.settings.currency||'INR')==='INR'?'en-IN':'en-US';}
function money(n,dp){
  n=num(n);var cur=state.settings.currency||'INR';
  var d=dp!=null?dp:(Math.abs(n-Math.round(n))<0.005?0:2);
  try{return new Intl.NumberFormat(loc(),{style:'currency',currency:cur,minimumFractionDigits:d,maximumFractionDigits:d}).format(n);}
  catch(e){return cur+' '+n.toFixed(d);}
}
function fmtG(n){return (Math.round(num(n)*10)/10).toLocaleString(loc())+' g';}
function pct(n){return Math.round(n)+'%';}
function fmtDate(s){
  if(!s)return '';var p=String(s).split('-').map(Number);if(!p[0])return s;
  return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function signed(n,dp){return (n<0?'\u2212':'')+money(Math.abs(n),dp);}

/* ---------- storage backends ---------- */
/*
 * Cloud backend:
 * VFORGE uses Supabase Auth + a single RLS-protected table.
 * The browser stores only the public project URL/key and a refresh token.
 * No password is stored by the CRM.
 */
var CLOUD_LOCAL_KEY='vforge3d:cloud';
// Public Supabase project details. Safe to include in a browser app when RLS is enabled.
var DEFAULT_CLOUD_URL='https://ogvbazpddpspmxvylypu.supabase.co';
var DEFAULT_CLOUD_KEY='sb_publishable_909chAD-mfxaSgrTNYKRXg_XOtgMbr_';
var cloudSession=null;
var cloudPollers=[];
function getCloudConfig(){
  try{
    var saved=JSON.parse(localStorage.getItem(CLOUD_LOCAL_KEY)||'{}')||{};

      var data=null;try{data=t?JSON.parse(t):null;}catch(e){data=t;}
      if(!r.ok){

      return {user:user,access_token:null,refresh_token:null};

function makeSupabaseBackend(){
  var c=getCloudConfig();
  if(!c.url||!c.anonKey||!cloudSession||!cloudSession.user)return null;
  function rows(col){
    // Defense in depth: explicitly scope reads to the signed-in user as well as relying on RLS.
    return cloudFetch('/rest/v1/vforge_records?user_id=eq.'+encodeURIComponent(cloudSession.user.id)+'&collection=eq.'+encodeURIComponent(col)+'&select=id,data&order=id.asc')
      .then(function(a){return (a||[]).map(function(r){return Object.assign({id:r.id},r.data||{});});});
  }
  function stopPollers(){cloudPollers.forEach(function(x){clearInterval(x);});cloudPollers=[];}
  stopPollers();
  return {
    kind:'cloud',
    fetch:function(col){return rows(col);},
    subscribe:function(col,cb,onErr){
      var active=true;
      function pull(){if(!active)return;rows(col).then(cb).catch(function(e){if(onErr)onErr(e);});}
      pull();
      var timer=setInterval(pull,10000);cloudPollers.push(timer);
      return function(){active=false;clearInterval(timer);};
    },
    save:function(col,id,data){
      var payload={user_id:cloudSession.user.id,collection:col,id:String(id),data:data,updated_at:new Date().toISOString()};
      return cloudFetch('/rest/v1/vforge_records?on_conflict=user_id,collection,id',{
        method:'POST',
        headers:cloudHeaders({Prefer:'resolution=merge-duplicates,return=minimal'}),
        body:JSON.stringify([payload])
      });
    },
    remove:function(col,id){
      // Defense in depth: scope deletes to this user's row; RLS remains the security boundary.
      return cloudFetch('/rest/v1/vforge_records?user_id=eq.'+encodeURIComponent(cloudSession.user.id)+'&collection=eq.'+encodeURIComponent(col)+'&id=eq.'+encodeURIComponent(id),{
        method:'DELETE',headers:cloudHeaders({Prefer:'return=minimal'})
      });
    },
    newId:function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9);}
  };
}
function makeDbBackend(db){
  return {
    kind:'workspace',
    subscribe:function(col,cb,onErr){
      return db.collection(col).onSnapshot(function(snap){
        cb(snap.docs.map(function(d){return Object.assign({id:d.id},d.data());}));
      },onErr);
    },
    fetch:function(col){return db.collection(col).get().then(function(snap){return snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});});},
    save:function(col,id,data){return db.collection(col).doc(id).set(data);},
    remove:function(col,id){return db.collection(col).doc(id).delete();},
    newId:function(col){return db.collection(col).doc().id;}
  };
}
function makeLocalBackend(){
  var mem={},subs={},persistent=true;
  try{localStorage.setItem('vforge3d:t','1');localStorage.removeItem('vforge3d:t');}catch(e){persistent=false;}
  function key(c){return 'vforge3d:'+c;}
  function load(c){try{return JSON.parse(localStorage.getItem(key(c))||'[]');}catch(e){return [];}}
  function persist(c){try{localStorage.setItem(key(c),JSON.stringify(mem[c]));}catch(e){}}
  function notify(c){(subs[c]||[]).forEach(function(cb){cb(mem[c].slice());});}
  COLS.forEach(function(c){mem[c]=persistent?load(c):[];});
  return {
    kind:persistent?'device':'memory',
    fetch:function(col){if(persistent)mem[col]=load(col);return Promise.resolve(mem[col].slice());},
    subscribe:function(col,cb){(subs[col]=subs[col]||[]).push(cb);cb(mem[col].slice());return function(){};},
    save:function(col,id,data){
      var rec=Object.assign({id:id},data),i=mem[col].findIndex(function(x){return x.id===id;});
      if(i>=0)mem[col][i]=rec;else mem[col].push(rec);
      persist(col);notify(col);return Promise.resolve();
    },
    remove:function(col,id){mem[col]=mem[col].filter(function(x){return x.id!==id;});persist(col);notify(col);return Promise.resolve();},
    newId:function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
  };
}
function errMsg(e){
  var c=e&&e.code;
  if(c==='quota_exceeded')return 'Storage is full. Delete some old records and try again.';
  if(c==='invalid_argument')return 'You can view this workspace but not change it.';
  if(c==='revoked')return 'Access to this workspace changed. Reload the page.';
  if(e&&e.status===401)return 'Cloud session expired. Reconnect in Settings.';
  if(e&&e.status===403)return 'Cloud access denied. Check the Supabase RLS policies.';
  return (e&&e.message)||'Could not save. Try again.';
}

function stopCloudPolling(){cloudPollers.forEach(function(x){clearInterval(x);});cloudPollers=[];}
function connectCloudFromForm(form,signup){
  var url=ctl(form,'cloud-url').value.trim().replace(/\/+$/,'');
  var key=ctl(form,'cloud-key').value.trim();
  var email=ctl(form,'cloud-email').value.trim();
  var password=ctl(form,'cloud-password').value;
  if(!url||!key||!email||!password){toast('Enter Supabase Project URL, publishable key, email and password.',true);return;}
  setCloudConfig({url:url,anonKey:key,email:email});
  supabaseClient=null;
  toast(signup?'Creating cloud account…':'Connecting to cloud…');
  cloudAuth(signup?'signup':'signin',email,password).then(function(data){
    if(signup&&!data.access_token){
      toast('Account created. Confirm your email, then press Connect Cloud.');
      return;
    }
    cloudSession=data;
    var cfg=getCloudConfig();cfg.refreshToken=data.refresh_token;cfg.userId=data.user&&data.user.id;setCloudConfig(cfg);
    // SAFETY: never auto-upload this browser's local data into the signed-in
    // cloud account. The old behavior could overwrite matching IDs or mix one
    // staff member's local records into another account. Connect first and
    // load the cloud as the source of truth; any local import must be a separate,
    // explicit, backed-up operation with a preview and conflict report.
    backend=makeSupabaseBackend();

}
function disconnectCloud(){

/* ---------- derived numbers ---------- */
function getStats(){
  if(statsCache&&statsVer===ver)return statsCache;
  var map=new Map();
  state.filaments.forEach(function(p){
    var key=p.key||fkey(p),e=map.get(key),stamp=(p.date||'')+'|'+(p.createdAt||'');
    if(!e){e={key:key,brand:p.brand,material:p.material,colour:p.colour,hex:safeHex(p.hex),bought:0,paid:0,used:0,recipeUsed:0,productionUsed:0,saleExtraUsed:0,first:stamp,last:stamp,prods:[]};map.set(key,e);}
    e.bought+=num(p.weight)*num(p.spools);e.paid+=num(p.total);
    if(stamp<e.first){e.first=stamp;e.brand=p.brand;e.material=p.material;e.colour=p.colour;}
    if(stamp>=e.last){e.last=stamp;e.hex=safeHex(p.hex);}
  });

  // A product is a recipe, not stock consumption by itself. "Quantity made"
  // records how many physical pieces were actually produced, so the recipe
  // grams are deducted from filament inventory exactly once for those pieces.
  state.products.forEach(function(pr){
    var qty=Math.max(0,num(pr.quantityMade));
    if(qty>0)(pr.lines||[]).forEach(function(l){
      var e=map.get(l.key);if(e)e.productionUsed+=num(l.grams)*qty;
    });
  });

  // Sales can contain multiple products. Preserve legacy single-product records and
  // apply the same production-vs-sale inventory rule to each line item.
  var soldByProduct=new Map();
  state.sales.forEach(function(s){saleLines(s).forEach(function(l){var pid=l.productId||s.productId;if(!pid)return;soldByProduct.set(pid,(soldByProduct.get(pid)||0)+Math.max(0,num(l.qty)));});});
  state.sales.forEach(function(s){saleLines(s).forEach(function(l){
    var pid=l.productId||s.productId,prod=state.products.find(function(pr){return pr.id===pid;});
    if(!prod){(l.usage||s.usage||[]).forEach(function(u){var e=map.get(u.key);if(e)e.used+=num(u.grams)*num(l.qty||s.qty);});return;}
    if(Math.max(0,num(prod.quantityMade))<=0){(l.usage||[]).forEach(function(u){var e=map.get(u.key);if(e)e.used+=num(u.grams)*num(l.qty);});}
  });});
  state.products.forEach(function(pr){var madeQty=Math.max(0,num(pr.quantityMade)),soldQty=soldByProduct.get(pr.id)||0,extraQty=Math.max(0,soldQty-madeQty);if(extraQty>0)(pr.lines||[]).forEach(function(l){var e=map.get(l.key);if(e)e.saleExtraUsed+=num(l.grams)*extraQty;});});

  state.wastage.forEach(function(w){var e=map.get(w.filamentKey);if(e)e.wastageUsed=(e.wastageUsed||0)+Math.max(0,num(w.grams));});
  state.products.forEach(function(pr){
    (pr.lines||[]).forEach(function(l){
      var e=map.get(l.key);if(!e)return;
      e.recipeUsed+=num(l.grams);
      var x=e.prods.find(function(q){return q.id===pr.id;});
      if(x)x.grams+=num(l.grams);else e.prods.push({id:pr.id,name:pr.name||'Untitled',grams:num(l.grams)});
    });
  });
  map.forEach(function(e){e.wastageUsed=e.wastageUsed||0;e.actualUsed=e.productionUsed+e.used+e.saleExtraUsed+e.wastageUsed;e.left=e.bought-e.actualUsed;e.cpg=e.bought>0?e.paid/e.bought:0;e.name=fname(e);});
  statsCache=map;statsVer=ver;return map;
}
function powerOf(printerId,hours){
  var pr=state.printers.find(function(x){return x.id===printerId;});
  var kwh=(pr?num(pr.watts)/1000:0)*num(hours);
  return {printer:pr,kwh:kwh,cost:kwh*num(state.settings.powerRate)};
}
function productCost(prod,S){
  var fil=0,grams=0;
  (prod.lines||[]).forEach(function(l){var e=S.get(l.key);fil+=num(l.grams)*(e?e.cpg:0);grams+=num(l.grams);});
  var pw=powerOf(prod.printerId,prod.printHours),other=num(prod.otherCost);
  return {fil:fil,elec:pw.cost,kwh:pw.kwh,other:other,total:fil+pw.cost+other,grams:grams};
}
function fmtHours(h){
  h=num(h);if(h<=0)return '';
  var t=Math.round(h*60),hh=Math.floor(t/60),mm=t%60;
  return (hh?hh+' h':'')+(hh&&mm?' ':'')+(mm?mm+' min':'');
}
function saleLines(s){
  if(Array.isArray(s.lineItems)&&s.lineItems.length)return s.lineItems;
  return [{productId:s.productId,productName:s.productName,qty:num(s.qty),unitPrice:num(s.unitPrice),unitCost:num(s.unitCost),usage:s.usage||[],printerId:s.printerId||'',hours:num(s.hours),gstRate:s.gstRate==null?null:s.gstRate,priceMode:s.priceMode||'exclusive',taxableUnit:s.taxableUnit,gstUnit:s.gstUnit,finalUnit:s.finalUnit}];
}
function saleRev(s){return Math.round(saleLines(s).reduce(function(t,l){return t+num(l.finalUnit!=null?l.finalUnit:(num(l.unitPrice)*(l.priceMode==='inclusive'?1:1+num(l.gstRate)/100)))*num(l.qty);},0)*100)/100;}
function saleTax(s){return Math.round(saleLines(s).reduce(function(t,l){return t+num(l.gstUnit)*num(l.qty);},0)*100)/100;}
function saleTaxable(s){return Math.round(saleLines(s).reduce(function(t,l){return t+num(l.taxableUnit!=null?l.taxableUnit:(l.priceMode==='inclusive'?num(l.unitPrice)/(1+num(l.gstRate)/100):num(l.unitPrice)))*num(l.qty);},0)*100)/100;}
function saleCost(s){return saleLines(s).reduce(function(t,l){return t+num(l.unitCost)*num(l.qty);},0);}
// Profit excludes collected GST: GST is a liability, not operating revenue.
function saleProfit(s){return Math.round((saleTaxable(s)-saleCost(s))*100)/100;}
function productGst(prod,price){
  if(!prod||prod.gstRate==null||prod.gstRate==='')return {rate:null,taxable:null,gst:null,total:null};
  var rate=num(prod.gstRate),p=num(price),inclusive=prod.priceMode==='inclusive';
  var taxable=inclusive?p/(1+rate/100):p;
  var gst=inclusive?p-taxable:p*rate/100;
  return {rate:rate,taxable:Math.round(taxable*100)/100,gst:Math.round(gst*100)/100,total:Math.round((inclusive?p:p+gst)*100)/100};
}
function custName(s){var c=state.customers.find(function(x){return x.id===s.customerId;});return (c&&c.name)||s.customerName||'Unknown customer';}
function prodName(s){var lines=saleLines(s);if(lines.length>1)return lines.map(function(l){return (state.products.find(function(x){return x.id===l.productId;})||{}).name||l.productName||'Deleted product';}).join(', ');var p=state.products.find(function(x){return x.id===s.productId;});return (p&&p.name)||s.productName||'Deleted product';}

  var c=new Date();c.setDate(c.getDate()-30);var cut=ymd(c);

function empty(title,text,act,label){
  return '<div class="empty"><h2>'+esc(title)+'</h2><p class="muted">'+esc(text)+'</p>'+(act?'<button class="btn primary" data-act="'+act+'">'+esc(label)+'</button>':'')+'</div>';
}
function spoolRow(e,low){
  var pc=e.bought>0?Math.max(0,Math.min(100,e.left/e.bought*100)):0;
  var status=e.left<=0?'<span class="tag low">Out of stock</span>':(e.left<=low?'<span class="tag low">Running low</span>':'');
  var left=e.left<0?'Over by '+fmtG(-e.left):fmtG(e.left)+' left';
  return '<div class="spool"><div class="spool-head"><span class="dot" style="background:'+safeHex(e.hex)+'"></span><strong>'+esc(e.name)+'</strong>'+status+'<span class="spool-left">'+left+'</span></div>'
    +'<div class="bar-track" role="img" aria-label="'+esc(e.name)+': '+Math.round(pc)+' percent left"><i style="width:'+pc.toFixed(1)+'%;background-color:'+safeHex(e.hex)+'"></i></div>'
    +'<div class="small muted">'+fmtG(e.bought)+' bought, '+fmtG(e.productionUsed)+' used for products made, '+fmtG(e.used)+' used in unproduced sales, '+fmtG(e.recipeUsed)+' configured per product piece, '+money(e.cpg,2)+' per gram</div>'
    +'<div class="small muted spool-prods">'+(e.prods&&e.prods.length?'Products using it: '+e.prods.slice().sort(byName).slice(0,4).map(function(x){return esc(x.name)+' '+fmtG(x.grams)+' each';}).join(', ')+(e.prods.length>4?' and '+(e.prods.length-4)+' more':''):'Not used in any product yet')+'</div></div>';
}
function vStart(){
  var f=state.filaments.length>0,p=state.products.length>0,s=state.sales.length>0;
  function li(done,title,text,act,label,enabled){
    return '<li class="'+(done?'done':'')+'"><div><strong>'+esc(title)+'</strong><p class="muted">'+esc(text)+'</p></div>'
      +(done?'<span class="tag paid">Done</span>':'<button class="btn'+(enabled?' primary':'')+'" data-act="'+act+'"'+(enabled?'':' disabled')+'>'+esc(label)+'</button>')+'</li>';
  }
  return '<section class="sec"><h2>Start with three entries</h2><ol class="start-list">'
    +li(f,'Log a filament purchase','Spool weight and what you paid give the cost per gram.','new-purchase','Log purchase',true)
    +li(p,'Add a product','Grams of filament used, product details and your listed price.','new-product','Add product',f)
    +li(s,'Record a sale','The selling price and the customer\u2019s details.','new-sale','Record sale',p)
    +'</ol>'+(state.printers.length?'':'<p class="small muted" style="margin-top:16px">Optional: <button class="linkish" data-view="printers">add your printers</button> so electricity is included in each product\u2019s cost.</p>')+'</section>';
}
function vOverview(){
  var S=getStats(),low=num(state.settings.lowStock);
  var rows=Array.from(S.values()).sort(function(a,b){return (a.bought?a.left/a.bought:0)-(b.bought?b.left/b.bought:0);});
  var stock=rows.length?'<section class="sec"><div class="sec-head"><h2>Filament on hand</h2><button class="linkish" data-view="filament">Open filament</button></div>'+rows.slice(0,6).map(function(e){return spoolRow(e,low);}).join('')+'</section>':'';
  if(!state.sales.length)return vStart()+stock;
  var list=periodSales(),rev=sum(list,saleRev),taxableRev=sum(list,saleTaxable),cost=sum(list,saleCost),profit=sum(list,saleProfit);
  var pend=sum(list.filter(function(s){return s.status==='pending';}),saleRev);
  var pendN=list.filter(function(s){return s.status==='pending';}).length;
  var figs='<div class="figures">'
    +'<div class="fig"><span class="fig-l">Sales</span><strong class="fig-v">'+money(rev)+'</strong><span class="fig-s">'+list.length+(list.length===1?' order':' orders')+'</span></div>'
    +'<div class="fig"><span class="fig-l">Cost of making</span><strong class="fig-v">'+money(cost)+'</strong><span class="fig-s">filament, power and extras</span></div>'
    +'<div class="fig"><span class="fig-l">Profit</span><strong class="fig-v'+(profit<0?' neg':'')+'">'+signed(profit)+'</strong><span class="fig-s">'+(taxableRev>0?pct(profit/taxableRev*100)+' margin':'no sales yet')+'</span></div>'
    +'<div class="fig"><span class="fig-l">Awaiting payment</span><strong class="fig-v">'+money(pend)+'</strong><span class="fig-s">'+pendN+(pendN===1?' order':' orders')+'</span></div></div>';
  var agg=new Map();
  list.forEach(function(s){saleLines(s).forEach(function(l){var k=l.productId||l.productName,e=agg.get(k)||{name:l.productName||prodName(s),units:0,profit:0};e.units+=num(l.qty);e.profit+=num(l.taxableUnit!=null?l.taxableUnit:(l.priceMode==='inclusive'?num(l.unitPrice)/(1+num(l.gstRate||0)/100):num(l.unitPrice)))*num(l.qty)-num(l.unitCost)*num(l.qty);agg.set(k,e);});});
  var top=Array.from(agg.values()).sort(function(a,b){return b.profit-a.profit;}).slice(0,5);
  var recent=sortedSales(list).slice(0,6);
  var recentHtml=recent.length?'<ul class="list">'+recent.map(function(s){
    var pr=saleProfit(s);
    return '<li class="row"><div><button class="linkish" data-open="sale:'+esc(s.id)+'">'+esc(custName(s))+'</button><span class="small muted">'+esc(prodName(s))+' \u00d7 '+num(s.qty)+', '+esc(fmtDate(s.date))+'</span></div><div class="row-r"><strong>'+money(saleRev(s))+'</strong><span class="small '+(pr<0?'neg':'muted')+'">profit '+signed(pr)+'</span></div></li>';
  }).join('')+'</ul>':'<p class="muted">No sales in this period.</p>';
  var topHtml=top.length?'<ul class="list">'+top.map(function(t){
    return '<li class="row"><div><strong>'+esc(t.name)+'</strong><span class="small muted">'+t.units+(t.units===1?' piece sold':' pieces sold')+'</span></div><div class="row-r"><strong class="'+(t.profit<0?'neg':'')+'">'+signed(t.profit)+'</strong><span class="small muted">profit</span></div></li>';
  }).join('')+'</ul>':'<p class="muted">Nothing sold in this period.</p>';
  return figs+'<div class="cols"><div>'+stock+'</div><div><section class="sec"><div class="sec-head"><h2>Recent sales</h2><button class="linkish" data-view="sales">All sales</button></div>'+recentHtml+'</section><section class="sec"><h2>Best earners</h2>'+topHtml+'</section></div></div>';
}
function vPrinters(){
  var rate='<p class="muted" style="margin:0 0 22px">Electricity is priced at <strong>'+money(state.settings.powerRate,2)+'</strong> per unit (kWh). Each product\u2019s print time and its printer\u2019s watts turn that into a power cost.</p>';
  if(!state.printers.length)return rate+empty('No printers yet','Add each printer with the watts it draws while printing. Then any product with a print time gets its electricity cost worked out.','new-printer','Add a printer');
  var hours={};
  state.sales.forEach(function(s){saleLines(s).forEach(function(l){var pid=l.printerId||s.printerId;if(pid)hours[pid]=(hours[pid]||0)+num(l.hours)*num(l.qty);});});
  var body=state.printers.slice().sort(byName).map(function(p){
    var n=state.products.filter(function(x){return x.printerId===p.id;}).length,h=hours[p.id]||0;
    return '<tr class="click" data-open="printer:'+esc(p.id)+'"><td><button class="linkish" data-open="printer:'+esc(p.id)+'">'+esc(p.name)+'</button>'+(p.notes?'<div class="small muted">'+esc(p.notes)+'</div>':'')+'</td><td class="num">'+num(p.watts)+' W</td><td class="num hide-sm">'+n+'</td><td class="num hide-sm">'+(fmtHours(h)||'0 h')+'</td><td class="num hide-sm">'+(Math.round(h*num(p.watts))/1000).toLocaleString(loc(),{maximumFractionDigits:1})+' kWh</td><td class="num">'+money(num(p.watts)/1000*num(state.settings.powerRate),2)+'</td></tr>';
  }).join('');
  return rate+'<div style="overflow-x:auto"><table><thead><tr><th>Printer</th><th class="num">Power</th><th class="num hide-sm">Products</th><th class="num hide-sm">Printed for sales</th><th class="num hide-sm">Energy used</th><th class="num">Power cost per hour</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function vFilament(){
  if(!state.filaments.length)return empty('No filament logged yet','Log each spool purchase with what you paid. The cost per gram is worked out from it, and used in every product.','new-purchase','Log a purchase');
  var S=getStats(),low=num(state.settings.lowStock);
  var rows=Array.from(S.values()).sort(byName);
  var purchases=state.filaments.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||'');});
  var body=purchases.map(function(p){
    var g=num(p.weight)*num(p.spools),cpg=g>0?num(p.total)/g:0;
    return '<tr class="click" data-open="purchase:'+esc(p.id)+'"><td>'+esc(fmtDate(p.date))+'</td><td><button class="linkish" data-open="purchase:'+esc(p.id)+'"><span class="dot" style="background:'+safeHex(p.hex)+'"></span>'+esc(fname(p))+'</button></td><td class="hide-sm">'+num(p.spools)+' \u00d7 '+fmtG(p.weight)+'</td><td class="num">'+money(p.total)+'</td><td class="num hide-sm">'+money(cpg,2)+'</td><td class="hide-sm muted">'+esc(p.supplier||'')+'</td></tr>';
  }).join('');
  return '<section class="sec"><div class="sec-head"><h2>On the shelf</h2></div>'+rows.map(function(e){return spoolRow(e,low);}).join('')+'</section>'
    +'<section class="sec"><div class="sec-head"><h2>Purchases</h2></div><div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Filament</th><th class="hide-sm">Spools</th><th class="num">Paid</th><th class="num hide-sm">Per gram</th><th class="hide-sm">Bought from</th></tr></thead><tbody>'+body+'</tbody></table></div></section>';
}
function vProducts(){
  if(!state.products.length)return empty('No products yet','A product records the grams of filament each piece uses, its details and your listed price, so profit is worked out on every sale.',state.filaments.length?'new-product':'new-purchase',state.filaments.length?'Add a product':'Log filament first');
  var S=getStats(),q=state.q.trim().toLowerCase();
  var list=state.products.filter(function(p){return !q||(p.name+' '+(p.category||'')+' '+(p.description||'')).toLowerCase().indexOf(q)>=0;}).sort(byName);
  if(!list.length)return '<p class="muted">No products match \u201c'+esc(state.q)+'\u201d.</p>';
  var body=list.map(function(p){
    var c=productCost(p,S),pg=productGst(p,p.price),sellNet=p.price==null?null:(p.gstRate==null?num(p.price):pg.taxable),m=sellNet==null||!p.lines||!p.lines.length?null:sellNet-c.total;
    var dots=(p.lines||[]).map(function(l){var e=S.get(l.key);return '<span class="dot" title="'+esc(l.name||'')+'" style="background:'+safeHex(e?e.hex:'#8a8f94')+'"></span>';}).join('');
    return '<tr class="click" data-open="product:'+esc(p.id)+'"><td><button class="linkish" data-open="product:'+esc(p.id)+'">'+esc(p.name)+'</button>'+(function(){var pw=powerOf(p.printerId,p.printHours),m=[];if(p.category)m.push(p.category);if(num(p.printHours)>0)m.push(fmtHours(p.printHours)+(pw.printer?' on '+pw.printer.name:''));return m.length?'<div class="small muted">'+esc(m.join(', '))+'</div>':'';})()+'</td><td class="hide-sm"><span class="dots">'+dots+'</span></td><td class="num hide-sm">'+fmtG(c.grams)+'</td><td class="num">'+(p.lines&&p.lines.length?money(c.total,2):'N/A')+'</td><td class="num">'+(p.price==null?'N/A':money(p.price))+'</td><td class="num"><span class="'+(m!==null&&m<0?'neg':'')+'">'+(m===null?'N/A':signed(m,2))+'</span>'+(sellNet!==null&&sellNet>0&&m!==null?'<div class="small muted">'+pct(m/sellNet*100)+' margin</div>':'')+'</td></tr>';
  }).join('');
  return '<div style="overflow-x:auto"><table><thead><tr><th>Product</th><th class="hide-sm">Filament</th><th class="num hide-sm">Grams</th><th class="num">Cost</th><th class="num">Listed price</th><th class="num">Margin</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function vSales(){
  if(!state.sales.length)return empty('No sales yet','Record what you sold, the price you sold it at and who bought it. Filament stock and profit update automatically.',state.products.length?'new-sale':(state.filaments.length?'new-product':'new-purchase'),state.products.length?'Record a sale':(state.filaments.length?'Add a product first':'Log filament first'));
  var q=state.q.trim().toLowerCase();
  var list=sortedSales(state.sales).filter(function(s){return !q||(custName(s)+' '+prodName(s)+' '+(s.notes||'')).toLowerCase().indexOf(q)>=0;});
  if(!list.length)return '<p class="muted">No sales match \u201c'+esc(state.q)+'\u201d.</p>';
  var body=list.map(function(s){
    var pr=saleProfit(s);
    return '<tr class="click" data-open="sale:'+esc(s.id)+'"><td class="hide-sm">'+esc(fmtDate(s.date))+'</td><td><button class="linkish" data-open="sale:'+esc(s.id)+'">'+esc(custName(s))+'</button><div class="small muted only-sm">'+esc(prodName(s))+' \u00d7 '+num(s.qty)+', '+esc(fmtDate(s.date))+'</div></td><td class="hide-sm">'+esc(prodName(s))+'</td><td class="num hide-sm">'+num(s.qty)+'</td><td class="num">'+money(saleRev(s))+'</td><td class="num hide-sm"><span class="'+(pr<0?'neg':'')+'">'+signed(pr)+'</span></td><td><span class="tag '+(s.status==='pending'?'pending':'paid')+'">'+(s.status==='pending'?'Pending':'Paid')+'</span></td></tr>';
  }).join('');
  return '<div style="overflow-x:auto"><table><thead><tr><th class="hide-sm">Date</th><th>Customer</th><th class="hide-sm">Product</th><th class="num hide-sm">Qty</th><th class="num">Total</th><th class="num hide-sm">Profit</th><th>Payment</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}

function vWastage(){
 var list=state.wastage.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
 if(!list.length)return empty('No wastage recorded','Log damaged, purged or otherwise wasted filament. Wastage reduces available filament stock.','new-wastage','Log wastage');
 return '<div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Filament</th><th class="num">Grams</th><th>Reason</th><th>Notes</th><th></th></tr></thead><tbody>'+list.map(function(w){var S=getStats(),e=S.get(w.filamentKey);return '<tr><td>'+esc(fmtDate(w.date))+'</td><td>'+esc(e?e.name:(w.filamentName||w.filamentKey))+'</td><td class="num">'+fmtG(w.grams)+'</td><td>'+esc(w.reason||'')+'</td><td>'+esc(w.notes||'')+'</td><td><button class="btn danger" data-act="delete-wastage:'+esc(w.id)+'">Delete</button></td></tr>';}).join('')+'</tbody></table></div>';
}
function vTransfers(){
 var list=state.transfers.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
 if(!list.length)return empty('No branch transfers yet','Record products moved to a branch. Transfers are tracked separately and do not count as external sales or reduce finished-product stock.','new-transfer','Record transfer');
 return '<div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Branch</th><th>Product</th><th class="num">Qty</th><th class="num">Price</th><th>Notes</th><th></th></tr></thead><tbody>'+list.map(function(t){return '<tr><td>'+esc(fmtDate(t.date))+'</td><td>'+esc(t.branch)+'</td><td>'+esc(t.productName)+'</td><td class="num">'+Math.max(1,num(t.quantity||1))+'</td><td class="num">'+(t.price==null?'N/A':money(t.price))+'</td><td>'+esc(t.notes||'')+'</td><td><button class="btn danger" data-act="delete-transfer:'+esc(t.id)+'">Delete</button></td></tr>';}).join('')+'</tbody></table></div>';
}
function wastageExceedsStock(grams,available){return !(available>0)||grams>available;}
function openWastage(){
 var opts=Array.from(getStats().values()).sort(byName);if(!opts.length){toast('Log a filament purchase before recording wastage.',true);return;}
 var html='<div class="dbody"><div class="field"><label>Date</label><input name="date" type="date" value="'+today()+'"></div><div class="field"><label>Filament</label><select name="filament">'+opts.map(function(e){return '<option value="'+esc(e.key)+'">'+esc(e.name)+' — '+fmtG(e.left)+' left</option>';}).join('')+'</select></div><div class="field"><label>Wasted grams</label><input name="grams" type="number" min="0.01" step="any" required></div><div class="field"><label>Reason</label><select name="reason"><option>Print failure</option><option>Purge / colour change</option><option>Test print</option><option>Damaged filament</option><option>Other</option></select></div><div class="field"><label>Notes (optional)</label><textarea name="notes"></textarea></div></div>'+foot('',false,'Save wastage');
 var f=openDrawer('Log filament wastage',html);wireSubmit(f,function(){var key=ctl(f,'filament').value,g=num(ctl(f,'grams').value);if(!(g>0))return fail(f,'Enter grams greater than zero.');if(!key)return fail(f,'Choose a valid filament. Refresh the CRM and try again.');/* Recalculate from the latest in-memory records at submit time; never trust the stock amount shown when the drawer opened. */statsCache=null;statsVer=-1;var e=getStats().get(key);if(!e)return fail(f,'Choose a valid filament. Refresh the CRM and try again.');if(wastageExceedsStock(g,e.left))return fail(f,'Wastage exceeds available stock ('+fmtG(Math.max(0,e.left))+' g available). Refresh the CRM and reduce the grams.');var d={date:ctl(f,'date').value||today(),filamentKey:key,filamentName:e?e.name:key,grams:g,reason:ctl(f,'reason').value,notes:ctl(f,'notes').value.trim(),createdAt:new Date().toISOString()};return save('wastage',backend.newId('wastage'),d).then(function(ok){if(ok)toast('Wastage recorded');return ok;});});
}
function openTransfer(){
 var opts=state.products.slice().sort(byName);
 var productOptions='<option value="">Choose product</option>'+opts.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>';}).join('');
 var html='<div class="dbody"><div class="grid2"><div class="field"><label>Date</label><input name="date" type="date" value="'+today()+'"></div><div class="field"><label>Branch name</label><input name="branch" placeholder="Enter branch name" required></div></div><div class="field"><div class="row-between"><label>Products</label><button type="button" class="btn secondary" data-add-transfer-product><span aria-hidden="true">＋</span> Add product</button></div><div data-transfer-items><div class="transfer-item grid2"><div class="field"><label>Product</label><select name="product" required>'+productOptions+'</select></div><div class="field"><label>Quantity</label><input name="quantity" type="number" min="1" step="1" value="1" required></div><div class="field"><label>Transfer price (optional)</label><input name="price" type="number" min="0" step="any" placeholder="Leave blank if unknown"></div></div></div></div><div class="field"><label>Notes (optional)</label><textarea name="notes"></textarea></div><p class="small muted">Transfers are not external sales and do not deduct finished-product stock.</p></div>'+foot('',false,'Save transfer');
 var f=openDrawer('Record branch transfer',html);
 var itemWrap=f.querySelector('[data-transfer-items]');
 f.querySelector('[data-add-transfer-product]').addEventListener('click',function(){
   var row=document.createElement('div');row.className='transfer-item grid2';row.innerHTML='<div class="field"><label>Product</label><select name="product" required>'+productOptions+'</select></div><div class="field"><label>Quantity</label><input name="quantity" type="number" min="1" step="1" value="1" required></div><div class="field"><label>Transfer price (optional)</label><div class="row-between"><input name="price" type="number" min="0" step="any" placeholder="Leave blank if unknown"><button type="button" class="btn danger" data-remove-transfer-product aria-label="Remove product">×</button></div></div>';
   row.querySelector('[data-remove-transfer-product]').addEventListener('click',function(){row.remove();});
   itemWrap.appendChild(row);
 });
 wireSubmit(f,function(){
   var branch=ctl(f,'branch').value.trim();if(!branch)return fail(f,'Enter a branch name.');
   var rows=Array.from(itemWrap.querySelectorAll('.transfer-item')),items=[];
   for(var i=0;i<rows.length;i++){
     var pid=rows[i].querySelector('[name="product"]').value,pr=state.products.find(function(p){return p.id===pid;});
     if(!pr)return fail(f,'Choose a product for every product row.');
     var q=num(rows[i].querySelector('[name="quantity"]').value);if(!(q>=1&&Number.isInteger(q)))return fail(f,'Enter a whole-number quantity of at least 1 for every product.');
     var priceInput=rows[i].querySelector('[name="price"]').value;

   return Promise.all(items.map(function(item){var d={date:date,branch:branch,productId:item.productId,productName:item.productName,quantity:item.quantity,price:item.price,notes:notes,transferGroupId:groupId,createdAt:createdAt};return save('transfers',backend.newId('transfers'),d);})).then(function(results){var ok=results.every(Boolean);if(ok)toast(items.length+' product'+(items.length===1?'':'s')+' transferred to '+branch);return ok;});
 });
}
function custStats(){
  var m=new Map();
  state.customers.forEach(function(c){m.set(c.id,{c:c,orders:0,spent:0,last:''});});
  state.sales.forEach(function(s){var e=m.get(s.customerId);if(e){e.orders++;e.spent+=saleRev(s);if((s.date||'')>e.last)e.last=s.date;}});
  return m;
}
function vCustomers(){
  if(!state.customers.length)return empty('No customers yet','Customers are added when you record a sale, or you can add one here first.','new-customer','Add a customer');
  var q=state.q.trim().toLowerCase(),M=custStats();
  var list=Array.from(M.values()).filter(function(e){var c=e.c;return !q||[c.name,c.phone,c.email,c.address].join(' ').toLowerCase().indexOf(q)>=0;}).sort(function(a,b){return byName(a.c,b.c);});
  if(!list.length)return '<p class="muted">No customers match \u201c'+esc(state.q)+'\u201d.</p>';
  var body=list.map(function(e){
    var c=e.c;
    return '<tr class="click" data-open="customer:'+esc(c.id)+'"><td><button class="linkish" data-open="customer:'+esc(c.id)+'">'+esc(c.name)+'</button>'+(c.address?'<div class="small muted">'+esc(c.address)+'</div>':'')+'</td><td class="hide-sm">'+esc(c.phone||'')+(c.email?'<div class="small muted">'+esc(c.email)+'</div>':'')+'</td><td class="num">'+e.orders+'</td><td class="num">'+money(e.spent)+'</td><td class="num hide-sm">'+esc(e.last?fmtDate(e.last):'')+'</td></tr>';
  }).join('');
  return '<div style="overflow-x:auto"><table><thead><tr><th>Customer</th><th class="hide-sm">Contact</th><th class="num">Orders</th><th class="num">Spent</th><th class="num hide-sm">Last order</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}

/* ---------- drawer ---------- */
var drawerOpen=false,lastFocus=null;
function openDrawer(title,html){
  closeDrawer(true);

function syncGoogleSheets(silent){
  var url=(state.settings.googleSheetsUrl||'').trim();
  if(!url){
    if(!silent)toast('Add your Google Sheets Web App URL in Settings first.',true);
    return Promise.reject(new Error('Google Sheets URL is not configured'));
  }
  if(!silent)toast('Sending report to Google Sheets…');

  // IMPORTANT: Do not use form.submit() or iframe navigation here.
  // In the ChatGPT/local HTML environment that can trigger an
  // "External site" confirmation popup. sendBeacon sends the POST in the
  // background without navigating the current page.
  var payload=sheetsPayload();
  var body=new URLSearchParams();
  body.append('payload',payload);

  return new Promise(function(resolve,reject){
    var sent=false;
    try{
      if(navigator.sendBeacon){
        sent=navigator.sendBeacon(url,body);
      }
    }catch(err){sent=false;}

    // Fallback for browsers that reject sendBeacon. This request also does
    // not navigate the page. Apps Script receives it as a POST parameter.
    if(!sent){
      try{
        fetch(url,{
          method:'POST',
          mode:'no-cors',
          body:body,
          keepalive:true,
          credentials:'omit'
        });
        sent=true;
      }catch(err){sent=false;}
    }

    if(!sent){
      if(!silent)toast('Could not send the Google Sheets report.',true);
      reject(new Error('Google Sheets request could not be queued'));
      return;
    }

    // Browser transport is opaque (sendBeacon/no-cors), so do not label this as a confirmed sync.
    if(!silent)toast('Request queued. Google Sheets receipt is not confirmed by this browser connection.',true);
    resolve({queued:true,confirmed:false});
  });
}

    a.click();
    a.remove();
    // Keep the Blob URL alive longer for browsers that start downloads asynchronously.
    setTimeout(function(){try{URL.revokeObjectURL(blobUrl);}catch(ignore){}},60000);
    toast('Download requested. If it does not appear, allow downloads for this site and try again.');
  }catch(e){
    if(blobUrl){try{URL.revokeObjectURL(blobUrl);}catch(ignore){}}
    toast('Browser could not start the download. No cloud data was changed.',true);
  }
}
function openSettings(){
  var s=state.settings,cc=getCloudConfig();
  var cloudStatus=state.storage==='cloud'
    ?'<div class="note" style="margin-bottom:14px;background:var(--accent-wash);color:var(--ink)">✓ Connected to cloud'+(cc.email?' as '+esc(cc.email):'')+'</div>'
    :'<div class="note" style="margin-bottom:14px">Cloud database is not connected. Your current records are stored in this browser only.</div>';
  var html='<div class="dbody"><div class="part">'
    +cloudStatus
    +'<h3>Cloud database</h3><p class="hint">Use the existing Supabase project to access cloud records. The publishable key is intended for browser use. Shared workspace access and Admin/Staff permissions are not enabled by this screen alone; they must be configured and verified in Supabase RLS before staff accounts are used.</p>'
    +'<div class="field"><label for="st-cloud-url">Supabase Project URL</label><input id="st-cloud-url" name="cloud-url" type="url" placeholder="https://xxxxxxxx.supabase.co" value="'+esc(cc.url||'')+'"></div>'
    +'<div class="field"><label for="st-cloud-key">Supabase publishable key</label><input id="st-cloud-key" name="cloud-key" type="password" autocomplete="off" placeholder="sb_publishable_..."></div>'
    +'<div class="field"><label for="st-cloud-email">Cloud login email</label><input id="st-cloud-email" name="cloud-email" type="email" value="'+esc(cc.email||'')+'" autocomplete="username"></div>'
    +'<div class="field"><label for="st-cloud-password">Cloud password</label><input id="st-cloud-password" name="cloud-password" type="password" autocomplete="current-password" placeholder="Not stored by CRM"></div>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn primary" data-cloud-action="connect">Connect Cloud</button>'+(state.storage==='cloud'?'<button type="button" class="btn danger" data-cloud-action="disconnect">Disconnect</button>':'')+'</div>'
    +'<p class="small muted" style="margin-top:10px">Connecting loads records from the signed-in cloud account. Browser-local records are not imported automatically. Use the same approved account to access its cloud records on another computer. Do not create staff accounts from this screen.</p>'
    +'</div>'
    +'<div class="part"><div class="field"><label for="st-cur">Currency</label><select id="st-cur" name="currency">'+CURRENCIES.map(function(c){return '<option value="'+c[0]+'"'+(c[0]===s.currency?' selected':'')+'>'+c[0]+', '+c[1]+'</option>';}).join('')+'</select></div>'
    +'<div class="field"><label for="st-rate">Electricity price per unit (kWh)</label><input id="st-rate" name="rate" type="number" inputmode="decimal" min="0" step="any" value="'+esc(s.powerRate)+'"></div>'
    +'<p class="small muted" style="margin:-8px 0 0">Tariffs differ by state and by home or commercial connection, so there is no single national price. Homes are commonly around \\u20b95 to \\u20b98 a unit and commercial connections \\u20b98 to \\u20b916. For the most accurate number, divide a full month\\u2019s bill by the units used.</p>'
    +'<div class="field"><label for="st-low">Warn when a filament is below (g)</label><input id="st-low" name="low" type="number" inputmode="numeric" min="0" step="any" value="'+esc(s.lowStock)+'"></div>'
    +'<div class="field"><label for="st-sheets">Google Sheets Web App URL <span class="opt">optional</span></label><input id="st-sheets" name="sheets" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="'+esc(s.googleSheetsUrl||'')+'"></div>'
    +(s.lastSheetsSync?'<div class="small muted">Last sync attempt: '+esc(new Date(s.lastSheetsSync).toLocaleString())+'</div>':'')+'</div>'
    +'<div class="part"><h3>Export &amp; backup tools</h3><p class="hint">Export your records or validate a backup file without changing live data.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn" data-export="csv">Sales as CSV</button><button type="button" class="btn" data-export="json">Everything as JSON</button><button type="button" class="btn" data-backup-preview>Validate backup</button></div><p class="small muted">Validation only: this tool never imports or overwrites CRM records.</p></div>'
    +'</div>'+foot('',false,'Save settings');
  var form=openDrawer('Settings',html);
  form.addEventListener('click',function(e){
    var preview=e.target.closest('[data-backup-preview]');
    if(preview){
      var picker=document.createElement('input');
      picker.type='file';picker.accept='.json,application/json';picker.style.display='none';
      document.body.appendChild(picker);
      picker.addEventListener('change',function(){
        var file=picker.files&&picker.files[0];picker.remove();if(!file)return;
        file.text().then(function(raw){
          var data;
          try{data=JSON.parse(raw);}catch(err){toast('Invalid JSON file. No data was changed.',true);return;}
          var groups=['filaments','printers','products','customers','sales','wastage','transfers'];
          var errors=[],warnings=[],counts={};
          if(!data||typeof data!=='object'||Array.isArray(data)){toast('Backup must contain a JSON object. No data was changed.',true);return;}
          if(data.schemaVersion!==2)warnings.push('Schema version is '+esc(data.schemaVersion==null?'missing':data.schemaVersion)+'; this CRM currently exports version 2.');
          groups.forEach(function(k){
            if(!Array.isArray(data[k]))errors.push(k+' must be an array.');
            else{
              counts[k]=data[k].length;
              var ids={},dupes=0;
              data[k].forEach(function(row){
                if(!row||typeof row!=='object'||Array.isArray(row)){errors.push(k+' contains a record that is not an object.');return;}
                if(row.id!=null){var id=String(row.id);if(ids[id])dupes++;ids[id]=true;}
              });
              if(dupes)warnings.push(k+' has '+dupes+' duplicate record ID(s).');
            }
          });
          if(!data.settings||typeof data.settings!=='object'||Array.isArray(data.settings))errors.push('settings must be an object.');
          else counts.settings=Object.keys(data.settings).length+' settings';
          var summary=groups.map(function(k){return '<tr><td>'+esc(k)+'</td><td style="text-align:right">'+(counts[k]==null?'—':counts[k])+'</td></tr>';}).join('');
          summary+='<tr><td>settings</td><td style="text-align:right">'+esc(counts.settings==null?'—':counts.settings)+'</td></tr>';
          var html='<div class="part"><h3>'+esc(file.name)+'</h3><p class="hint">File size: '+(file.size/1024).toFixed(1)+' KB'+(data.exportedAt?' · Exported: '+esc(data.exportedAt):'')+'</p><p><strong>'+(errors.length?'Validation failed':warnings.length?'Structure looks readable; review warnings':'Structure looks valid')+'</strong></p><table class="data-table"><thead><tr><th>Data group</th><th style="text-align:right">Count</th></tr></thead><tbody>'+summary+'</tbody></table>';
          if(errors.length)html+='<div class="notice error"><strong>Errors</strong><ul>'+errors.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
          if(warnings.length)html+='<div class="notice"><strong>Warnings</strong><ul>'+warnings.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>';
          html+='<p class="hint">This is a read-only preview. No records were imported, merged, replaced, or deleted.</p></div>'+foot('',false,'Close');
          var previewForm=openDrawer('Backup validation',html);
          wireSubmit(previewForm,function(){closeDrawer();return true;});
        }).catch(function(){picker.remove();toast('Could not read this file. No data was changed.',true);});
      },{once:true});
      picker.click();
      return;
    }
    var b=e.target.closest('[data-export]');
    if(b){
      if(b.dataset.export==='csv')offerFile('vforge-3d-sales.csv',salesCsv());
      else offerFile('vforge-3d-backup.json',JSON.stringify({exportedAt:new Date().toISOString(),schemaVersion:2,filaments:state.filaments,printers:state.printers,products:state.products,customers:state.customers,sales:state.sales,wastage:state.wastage,transfers:state.transfers,settings:state.settings},null,2));
      return;
    }
    var c=e.target.closest('[data-cloud-action]');
    if(!c)return;
    if(c.dataset.cloudAction==='disconnect'){disconnectCloud();closeDrawer();}
    else if(c.dataset.cloudAction==='connect')connectCloudFromForm(form,false);
    else if(c.dataset.cloudAction==='signup'){toast('Create staff accounts through the Supabase administrator workflow.',true);}
  });
  wireSubmit(form,function(){
    var low=Math.max(0,num(ctl(form,'low').value));
    var newUrl=ctl(form,'sheets').value.trim();
    return save('settings','main',{currency:ctl(form,'currency').value,lowStock:low,powerRate:Math.max(0,num(ctl(form,'rate').value)),googleSheetsUrl:newUrl,lastSheetsSync:s.lastSheetsSync||''}).then(function(ok){
      if(ok){state.settings.googleSheetsUrl=newUrl;toast('Settings saved');}
      return ok;
    });
  });
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-dclose]');
  if(t&&drawerOpen){closeDrawer();return;}
  t=e.target.closest('[data-view]');
  if(t&&!drawerOpen){go(t.dataset.view);return;}
  t=e.target.closest('[data-open]');
  if(t&&!drawerOpen){
    var p=t.dataset.open.split(':'),k=p[0],id=p.slice(1).join(':');
    if(k==='purchase')openPurchase(id);else if(k==='printer')openPrinter(id);else if(k==='product')openProduct(id);else if(k==='sale')openSale(id);else if(k==='customer')openCustomer(id);
    return;
  }
  t=e.target.closest('[data-act]');
  if(t&&!drawerOpen&&!t.disabled){
    var a=t.dataset.act;
    if(a==='new-purchase')openPurchase();
    else if(a==='new-product')openProduct();
    else if(a==='new-printer')openPrinter();
    else if(a==='new-sale')openSale();
    else if(a==='new-customer')openCustomer();
    else if(a==='new-wastage')openWastage();
    else if(a==='new-transfer')openTransfer();
    else if(a.indexOf('delete-wastage:')===0){var wid=a.slice(15);if(confirm('Delete this wastage record?'))remove('wastage',wid).then(function(ok){if(ok)toast('Wastage record deleted');});}
    else if(a.indexOf('delete-transfer:')===0){var tid=a.slice(17);if(confirm('Delete this branch transfer?'))remove('transfers',tid).then(function(ok){if(ok)toast('Transfer deleted');});}
    else if(a==='settings')openSettings();
    else if(a==='sync-sheets')syncGoogleSheets();
    else if(a==='test-sheets')testGoogleSheets();
    else if(a==='export-report-csv')exportReportsCsv();
    else if(a==='refresh')refresh(false);
    else if(a.indexOf('period:')===0){state.period=a.slice(7);renderToolbar();renderContent();}
  }
});
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&state.ready&&Date.now()-lastRefresh>15000)refresh(true);
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){state.q=e.target.value;renderContent();}
});
document.addEventListener('keydown',function(e){
  if(!drawerOpen)return;
  if(e.key==='Escape'){closeDrawer();return;}
  if(e.key!=='Tab')return;
  var d=$('.drawer');if(!d)return;
  var f=$$('button,input,select,textarea',d).filter(function(x){return !x.disabled&&(x.offsetParent!==null||x===document.activeElement);});
  if(!f.length)return;
  var first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});

/* ---------- refresh ---------- */
var refreshing=false,lastRefresh=Date.now();
function setStamp(){
  var e=$('#stamp');
  if(e&&state.updatedAt)e.textContent='Updated '+state.updatedAt.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
}
function refresh(silent){
  if(refreshing||!backend)return Promise.resolve();
  refreshing=true;lastRefresh=Date.now();
  var b=$('#refresh-btn');if(b){b.classList.add('busy');b.disabled=true;}
  return Promise.all(COLS.map(function(c){return Promise.resolve(backend.fetch(c)).then(function(docs){onDocs(c,docs);});}))
    .then(function(){if(!silent)toast('Refreshed');},function(){if(!silent)toast('Could not refresh. Check your connection and try again.',true);})
    .then(function(){refreshing=false;var b2=$('#refresh-btn');if(b2){b2.classList.remove('busy');b2.disabled=false;}});
}

/* ---------- boot ---------- */
function onDocs(col,docs){
  if(col==='settings'){
    var m=docs.find(function(d){return d.id==='main';});
    state.settings=Object.assign({currency:'INR',lowStock:200,powerRate:DEFAULT_RATE,googleSheetsUrl:'',lastSheetsSync:''},m||{});
  }else state[col]=docs;
  ver++;state.loaded[col]=true;state.updatedAt=new Date();
  if(!state.ready&&COLS.every(function(c){return state.loaded[c];}))state.ready=true;
  if(state.ready){
    renderContent();setStamp();
    // Google Sheets sync is manual until the endpoint supports verifiable receipts.
    // This avoids repeated background writes and misleading "queued" confirmations.
  }
}
function boot(){
  render();
  var claude=window.claude,useFn=claude&&typeof claude.use==='function';
  var dlP=useFn?Promise.resolve().then(function(){return claude.use('downloads');}).catch(function(){return null;}):Promise.resolve(null);
  Promise.resolve().then(function(){
    var cc=getCloudConfig();
    if(cc.url&&cc.anonKey&&cc.refreshToken){
      return cloudRefresh().then(function(){
        backend=makeSupabaseBackend();
        if(backend){state.storage='cloud';return true;}
        throw new Error('Cloud backend could not be initialized.');
      }).catch(function(){
        cloudSession=null;
        backend=makeLocalBackend();
        state.storage=backend.kind;
        return false;
      });
    }
    backend=makeLocalBackend();
    state.storage=backend.kind;
    return false;
  }).then(function(){
    return dlP;
  }).then(function(dl){
    dlCap=dl;
    renderNotice();
    COLS.forEach(function(c){
      backend.subscribe(c,function(docs){onDocs(c,docs);},function(err){
        if(state.storage==='cloud'&&err&&err.status===401){
          cloudRefresh().catch(function(){toast('Cloud session expired. Reconnect in Settings.',true);});
        }else{
          toast(err&&err.code==='revoked'?'Access to this workspace changed. Reload the page.':'Live updates stopped. Check your connection.',true);
        }
      });
    });
    setTimeout(function(){if(!state.ready){state.ready=true;renderContent();}},6000);
  });
}
boot();
})();
</script>
